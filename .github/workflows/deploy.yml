name: Deploy to WildFly

on:
  push:
    branches: [master]
  workflow_dispatch: {}   # lets you re-run a deploy manually from the Actions tab

# Never let two deploys touch the deployments folder at once.
concurrency:
  group: wildfly-deploy
  cancel-in-progress: false

env:
  DEPLOY_NAME: Jamstudy.war
  DEPLOY_DIR: C:\Wildfly\wildfly-22.0.0.Final\standalone\deployments

jobs:
  build-and-deploy:
    # Runs on the self-hosted runner installed on the WildFly VM.
    # Add a custom label at runner-config time and swap it in here if you ever
    # register more than one self-hosted runner.
    runs-on: [self-hosted, Windows]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build WAR
        shell: cmd
        run: mvnw.cmd -B clean package -DskipTests

      - name: Deploy to WildFly
        shell: powershell
        run: |
          .\scripts\deploy-wildfly.ps1 `
            -WarSource "target\${{ env.DEPLOY_NAME }}" `
            -DeployDir "${{ env.DEPLOY_DIR }}" `
            -DeployName "${{ env.DEPLOY_NAME }}"

      - name: Upload WAR on failure (for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Jamstudy-war-${{ github.run_id }}
          path: target/Jamstudy.war
          retention-days: 5
          if-no-files-found: ignore
