name: Deploy to WildFly

on:
  push:
    branches: [master]
  workflow_dispatch: {}   # lets you re-run a deploy manually from the Actions tab

env:
  DEPLOY_NAME: Jamstudy.war
  DEPLOY_DIR: C:\Wildfly\wildfly-22.0.0.Final\standalone\deployments
  # WildFly Windows service name — used to fully restart WildFly on a failed deploy.
  # Find it with: Get-Service | ? { $_.Name -match 'wildfly|jboss' }
  SERVICE_NAME: Wildfly

jobs:
  build:
    runs-on: [self-hosted, Windows]
    timeout-minutes: 25
    # A newer push cancels an in-progress (or queued) build — killing mvn is harmless.
    concurrency:
      group: jamstudy-build
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build WAR
        shell: cmd
        run: mvnw.cmd -B clean package -DskipTests

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: jamstudy-war
          path: target/Jamstudy.war
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: [self-hosted, Windows]
    timeout-minutes: 20
    # An in-flight deploy is NEVER cancelled — the next one queues behind it and
    # then deploys the newer build.
    concurrency:
      group: jamstudy-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout (for the deploy script)
        uses: actions/checkout@v4

      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: jamstudy-war
          path: artifact

      - name: Deploy to WildFly
        shell: powershell
        run: |
          # Hot deploy via the scanner. The runner account can't stop the WildFly
          # service, so -AlwaysRestart can't do a clean restart anyway; -ServiceName
          # is still passed so failure-recovery can try. Metaspace is now 512M and
          # the app shuts down cleanly, so hot deploys survive many more cycles.
          .\scripts\deploy-wildfly.ps1 `
            -WarSource "artifact\${{ env.DEPLOY_NAME }}" `
            -DeployDir "${{ env.DEPLOY_DIR }}" `
            -DeployName "${{ env.DEPLOY_NAME }}" `
            -ServiceName "${{ env.SERVICE_NAME }}"
