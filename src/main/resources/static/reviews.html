<script>

    const backendUrlRoot = "https://unistart.ro/Jamstudy";

    $wrapper = $("#wrapper");
    $(document).on({
        <!-- ajaxStart: function() { $wrapper.addClass("loading");    }, -->
        ajaxStop: function() {
            $wrapper.removeClass("loading");
        }
    });

    var currentlyVisibleReviewsNo = 0;

    $(document).ready(function() {
        getPageHeader();
        getPageFooter();
        myAccountText();
        loadUser();
        getReviews(false);
        getRecentlyViewedFaculties();
    });

    function loadMore() {
        getReviews(true);
    }

    function getReviews(loadMore) {

        <!-- var numberOfResultsPerPage = document.getElementById("reviews-results-on-page").value; -->
        var numberOfResultsPerPage = 10;
        var sortingOrder = document.getElementById("reviews-sorting").value;
        var searchKeyword = document.getElementById("search-review-keyword").value;

        var offset;
        if (loadMore) {
            offset = currentlyVisibleReviewsNo;
        } else {
            offset = 0;
        }

        var backendUrlReviews = new URL(backendUrlRoot + "/v1/review");

        if (offset) {
            backendUrlReviews.searchParams.append("offset", offset);
        }
        if (numberOfResultsPerPage) {
            backendUrlReviews.searchParams.append("limit", numberOfResultsPerPage);
        }
        if (sortingOrder) {
            backendUrlReviews.searchParams.append("orderBy", sortingOrder);
        }
        if (searchKeyword) {
            backendUrlReviews.searchParams.append("searchBy", searchKeyword);
        }

        $.ajax({
            url: backendUrlReviews,
            type: "GET",
            beforeSend : function(request) {
                if (!loadMore) {
                    document.getElementById("review-entries").innerHTML = '	<div class="text-center">'
                        +'<div class="uil-reload-css reload-background" style=""><div></div></div>'
                        +'</div>';
                    document.getElementById("load-more-reviews-main").innerHTML = '';
                } else {
                    document.getElementById("load-more-reviews-main").innerHTML = '<div class="text-center"><div class="uil-reload-css reload-background" style=""><div></div></div></div>';
                }
            },
            success: function(response) {

                loadReviewsTab(response, loadMore);

            },
            error: function(error) {
                checkLoggedInUser(error.status)
            }
        });
    }

    function loadReviewsTab(response, loadMore) {

        if (loadMore) {
            currentlyVisibleReviewsNo += response.result.reviews.length;
        } else {
            document.getElementById("review-entries").innerHTML = '';
            currentlyVisibleReviewsNo = response.result.reviews.length;
        }

        if  (currentlyVisibleReviewsNo >= response.result.count) {
            document.getElementById("load-more-reviews-main").innerHTML = '';
        } else {
            document.getElementById("load-more-reviews-main").innerHTML = '<div class="card">'
                + '<div class="content"> '
                + '<div class="text-center row"> '
                + '<button id="load-more-reviews" class="btn btn-info btn-fill" type="submit" onclick="loadMore()">Încarcă mai multe rezultate</button>'
                + '</div> '
                + '</div> '
                + '</div>';
        }

        if (response.result.reviews.length == 0) {
            document.getElementById("review-entries").innerHTML = '<div class="text-center text-muted"> <h4>Nu au fost găsite rezultate</h4> </div>';
        }

        var facultyIds = response.result.reviews.map(r => r.facultyId);
        var backendUrlFaculties = new URL(backendUrlRoot + "/v1/faculty");
        backendUrlFaculties.searchParams.append("facultyIds", facultyIds);
        backendUrlFaculties.searchParams.append("limit", 999);

        $.ajax({
            url: backendUrlFaculties,
            type: "GET",
            success: function(facultyResponse) {

                if (facultyResponse.control.errorCode === 0) {

                var i;
                for (i in response.result.reviews) {

                    var facultyId = response.result.reviews[i].facultyId;
                    var faculty = facultyResponse.result.faculties.filter(f => facultyId === f.facultyId)[0];
                    console.log(faculty);

                    var urlProfileRedirect = "./profile.html?id=";

                    var facultyName = faculty.facultyName;
                    var universityName = faculty.universityName;
                    var facultyCity = faculty.facultyCity;
                    var avgRating = faculty.avgRating;
                    if (!avgRating) {
                        avgRating = "N/A";
                    } else {
                        avgRating = avgRating.toFixed(1);
                    }

                    var countRev = faculty.countRev;
                    var countRevText;
                    if (!countRev) {
                        countRevText = "";
                    } else if (countRev === 1) {
                        countRevText = "din 1 evaluare";
                    } else {
                        countRevText = "din " + countRev + " evaluări";
                    }

                    var universityNameForLogo = universityName.replaceAll("\"", "_");
                    var logoName = facultyName + universityNameForLogo;
                    var logoSrc = backendUrlRoot + "/v1/faculty/" + faculty.facultyId + "/logo";

                    var savedFacultiesIds = getUField("usf");
                    var favoriteClass;
                    var favoriteTooltipText;
                    var favoriteText;
                    if (savedFacultiesIds && savedFacultiesIds.includes(facultyId)) {
                        favoriteClass = "fas fa-heart fa-lg";
                        favoriteTooltipText = "Elimină";
                        favoriteText = "Salvată";
                    } else {
                        favoriteClass = "far fa-heart fa-lg";
                        favoriteTooltipText = "Salvează";
                        favoriteText = "Salvează";
                    }

                    var searchCompareString1;
                    var searchCompareString2;
                    if ($(window).width() > 992) {
                        searchCompareString1 = '<div class="col-xs-1">			<div data-toggle="tooltip" title="' + favoriteTooltipText + '"  class="text-center" style="margin-top:10px;">					<button class="btn-danger btn btn-simple save" onclick="addToFavorites(this, &quot;'+facultyId+'&quot;, false)"><i class="' + favoriteClass + '" style="margin-right: 7px"></i></button>												</div>	<div data-toggle="tooltip" title="Compară" class="text-center" style="margin-top:85px;">													<button class="compare btn btn-simple" onclick="addToCompare(this, &quot;'+facultyId+'&quot;, false)"><i class="fas fa-plus-circle fa-lg" style="margin-right: 7px; "></i></button>												</div>				</div>';
                        searchCompareString2 = '';
                    } else {
                        searchCompareString1 = '';
                        searchCompareString2 = '<div class="row save-compare-search-list"> <div class="col-xs-6"> <button class="btn-danger btn btn-simple save" onclick="addToFavorites(this, &quot;'+facultyIdTop+'&quot;, false)"><i class="' + favoriteClass + '" style="margin-right: 7px"></i><span>' + favoriteText + '</span></button> </div> <div class="col-xs-6 text-right" > <button class="btn btn-simple compare" onclick="addToCompare(this, &quot;'+facultyId+'&quot;, false)"><i class="fas fa-plus-circle fa-lg" style="margin-right: 7px; "></i><span>Compară</span> </button></div> </div>	';
                    }

                    var reviewId = response.result.reviews[i].reviewId;
                    var userName = response.result.reviews[i].userName ? response.result.reviews[i].userName : "";
                    var formattedReviewDate = response.result.reviews[i].formattedReviewDate ? response.result.reviews[i].formattedReviewDate : "N/A";
                    var userStatus = response.result.reviews[i].userStatus ? response.result.reviews[i].userStatus.toLowerCase() : "";
                    if (userStatus === 'drop-out') {
                        userStatus = "";
                    }
                    var userDomainOfLicenseOrMaster = response.result.reviews[i].userDomainOfLicenseOrMaster ? response.result.reviews[i].userDomainOfLicenseOrMaster : "";
                    var userProgramName = response.result.reviews[i].userProgramName ? response.result.reviews[i].userProgramName : "";
                    var userYear = response.result.reviews[i].userYear ? response.result.reviews[i].userYear : "";
                    var userDetailsString = userStatus + (userYear ? " - " + userYear : "") + (userDomainOfLicenseOrMaster ? " - " + userDomainOfLicenseOrMaster : "") + (userProgramName ? " - " + userProgramName : "");
                    var upvotes = response.result.reviews[i].upvotes ? response.result.reviews[i].upvotes : 0;
                    var wouldRecommend = response.result.reviews[i].wouldRecommend;
                    var wouldRecommendText;
                    var wouldRecommendBoxClass;
                    var wouldRecommendTextClass;
                    if (wouldRecommend === true) {
                        wouldRecommendText = "Ar recomanda";
                        wouldRecommendBoxClass = "box green";
                        wouldRecommendTextClass = "would-recommend-text";
                    } else if (wouldRecommend === false) {
                        wouldRecommendText = "Nu ar recomanda";
                        wouldRecommendBoxClass = "box red";
                        wouldRecommendTextClass = "would-not-recommend-text";
                    } else {
                        wouldRecommendText = "";
                        wouldRecommendBoxClass = "";
                        wouldRecommendTextClass = "";
                    }

                    var difficulty = response.result.reviews[i].difficulty;
                    var difficultyText;
                    if (difficulty) {
                        difficultyText = 'Dificultate:&nbsp' + difficulty + '/5';
                    } else {
                        difficultyText = "";
                    }
                    var wouldRecommendAndDifficultyRowString;
                    if (wouldRecommendText || difficulty) {
                        wouldRecommendAndDifficultyRowString =
                            '<br>'
                            +'													<div class="row">'
                            +'														<div  class="col-xs-6">'
                            +'															<div class="'+ wouldRecommendBoxClass + '">'
                            +'															</div>'
                            +'															<span class=' + wouldRecommendTextClass + '>&nbsp&nbsp' + wouldRecommendText + '</span>'
                            +'														</div>'
                            +'													<div  class="col-xs-6">'
                            +'															<span style="color: #707070;">&nbsp&nbsp' + difficultyText + '</span>'
                            +'														</div>'
                            +'													</div>';
                    } else {
                        wouldRecommendAndDifficultyRowString = "";
                    }

                    var upvotedReviewsIds = getUField("ulr");
                    var upvotedRevClass;
                    var upvotedRevText;
                    if (upvotedReviewsIds && upvotedReviewsIds.includes(reviewId)) {
                        upvotedRevClass = "fas fa-thumbs-up fa-lg like-review align";
                    } else {
                        upvotedRevClass = "far fa-thumbs-up fa-lg like-review align";
                    }


                    var generalRating = response.result.reviews[i].generalRating ? response.result.reviews[i].generalRating : "N/A";
                    var reviewText = response.result.reviews[i].reviewText ? response.result.reviews[i].reviewText : "N/A";

                    var jobProspectsReviewCategory = response.result.reviews[i].jobProspectsReview;
                    var jobProspectsReviewRating = (jobProspectsReviewCategory && jobProspectsReviewCategory.generalRating) ? jobProspectsReviewCategory.generalRating : "N/A";
                    var jobProspectsReviewText = (jobProspectsReviewCategory && jobProspectsReviewCategory.reviewText) ? jobProspectsReviewCategory.reviewText : "";

                    var coursesAndLecturersReviewCategory = response.result.reviews[i].coursesAndLecturersReview;
                    var coursesAndLecturersReviewRating = (coursesAndLecturersReviewCategory && coursesAndLecturersReviewCategory.generalRating) ? coursesAndLecturersReviewCategory.generalRating : "N/A";
                    var coursesAndLecturersReviewText = (coursesAndLecturersReviewCategory && coursesAndLecturersReviewCategory.reviewText) ? coursesAndLecturersReviewCategory.reviewText : "";

                    var studentOrganisationsReviewCategory = response.result.reviews[i].studentOrganisationsReview;
                    var studentOrganisationsReviewRating = (studentOrganisationsReviewCategory && studentOrganisationsReviewCategory.generalRating) ? studentOrganisationsReviewCategory.generalRating : "N/A";
                    var studentOrganisationsReviewText = (studentOrganisationsReviewCategory && studentOrganisationsReviewCategory.reviewText) ? studentOrganisationsReviewCategory.reviewText : "";

                    var accomodationReviewCategory = response.result.reviews[i].accomodationReview;
                    var accomodationReviewRating = (accomodationReviewCategory && accomodationReviewCategory.generalRating) ? accomodationReviewCategory.generalRating : "N/A";
                    var accomodationReviewText = (accomodationReviewCategory && accomodationReviewCategory.reviewText) ? accomodationReviewCategory.reviewText : "";

                    var facultyFacilitiesReviewCategory = response.result.reviews[i].facultyFacilitiesReview;
                    var facultyFacilitiesReviewRating = (facultyFacilitiesReviewCategory && facultyFacilitiesReviewCategory.generalRating) ? facultyFacilitiesReviewCategory.generalRating : "N/A";

    function getRecentlyViewedFaculties() {

        if (typeof(Storage) == "undefined") {
            return;
        }

        var facultyIdsString = localStorage.getItem("rvi");
        var facultyIds;
        if (facultyIdsString) {
            facultyIds = facultyIdsString.split(",");
        }
        if (!facultyIds || facultyIds.length === 0) {
            document.getElementById("recently-viewed-faculties").innerHTML = '';
            document.getElementById("recent-faculties-section").style.padding = '0px';
            return;
        }

        var limit = 16;
        var backendUrl = new URL(backendUrlRoot + "/v1/faculty");
        backendUrl.searchParams.append("facultyIds", facultyIds.join());
        backendUrl.searchParams.append("limit", limit);

        $.ajax({
            url: backendUrl,
            type: "GET",
            beforeSend : function(request) {
                document.getElementById("recently-viewed-faculties").innerHTML = '	<div class="text-center" style="height: 350px;">'
                    +'<div class="uil-reload-css reload-background" style=""><div></div></div>'
                    +'</div>';

            },
            success: function(response) {
                if (response.control.errorCode === 0) {
                    var facultyIdsCopy = facultyIds.slice();
                    var sortedResponse = response.result.faculties.map(function(item) {
                        var n = facultyIdsCopy.indexOf(item.facultyId);
                        facultyIdsCopy[n] = '';
                        return [n, item]
                    }).sort(function (a, b) { return a[0] - b[0];  }).map(function(j) { return j[1] });
                    sortedResponse = sortedResponse.reverse();
                    loadRecentlyViewedFacultiesContent(sortedResponse);
                } else {
                    console.log(response.control.errorDescription);
                }

            },
            error: function(error) {
                checkLoggedInUser(error.status);
            }
        });
    }

    function loadRecentlyViewedFacultiesContent(sortedResponse) {

        var faculties = sortedResponse;

        if (faculties.length == 0 ) {

            recentFacultiesPerSlide = 3;
