<script>

    const backendUrlRoot = "https://unistart.ro/Jamstudy";

    $wrapper = $("#wrapper");
    $(document).on({
        <!-- ajaxStart: function() { $wrapper.addClass("loading");    }, -->
        ajaxStop: function() {
            $wrapper.removeClass("loading");
        }
    });

    var currentlyVisibleReviewsNo = 0;
    var allReviewsExpanded = false;

    $(document).ready(function() {
        getPageHeader();
        getPageFooter();
        myAccountText();
        getLoginModal();
	    getRegisterModal();
        loadUser();
        getReviews(false);
        getRecentlyViewedFaculties();

        document.getElementById("search-review-keyword").addEventListener("keyup", function(event) {
          // Number 13 is the "Enter" key on the keyboard
          if (event.keyCode === 13) {
            event.preventDefault();
            document.getElementById("search-reviews-icon").click();
          }
        });
    });

    function loadMore() {
        getReviews(true);
    }

    function getReviews(loadMore) {

        <!-- var numberOfResultsPerPage = document.getElementById("reviews-results-on-page").value; -->
        var numberOfResultsPerPage = 10;
        var sortingOrder = document.getElementById("reviews-sorting").value;
        var searchKeyword = document.getElementById("search-review-keyword").value;

        var offset;
        if (loadMore) {
            offset = currentlyVisibleReviewsNo;
        } else {
            offset = 0;
        }

        var backendUrlReviews = new URL(backendUrlRoot + "/v1/review");

        if (offset) {
            backendUrlReviews.searchParams.append("offset", offset);
        }
        if (numberOfResultsPerPage) {
            backendUrlReviews.searchParams.append("limit", numberOfResultsPerPage);
        }
        if (sortingOrder) {
            backendUrlReviews.searchParams.append("orderBy", sortingOrder);
        }
        if (searchKeyword) {
            backendUrlReviews.searchParams.append("searchBy", searchKeyword);
        }
        var userStatusFilter = Array.prototype.slice.call(document.querySelectorAll('input[name="user-status-filter"]:checked')).map(function(el) { return el.value; });
        if (userStatusFilter.length > 0) {
            backendUrlReviews.searchParams.append("userStatus", userStatusFilter.join(","));
        }

        $.ajax({
            url: backendUrlReviews,
            type: "GET",
            beforeSend : function(request) {
                if (!loadMore) {
                    document.getElementById("review-entries").innerHTML = '	<div class="text-center">'
                        +'<div class="uil-reload-css reload-background" style=""><div></div></div>'
                        +'</div>';
                    document.getElementById("load-more-reviews-main").innerHTML = '';
                } else {
                    document.getElementById("load-more-reviews-main").innerHTML = '<div class="text-center"><div class="uil-reload-css reload-background" style=""><div></div></div></div>';
                }
            },
            success: function(response) {

                loadReviewsTab(response, loadMore);

            },
            error: function(error) {
                checkLoggedInUser(error.status)
            }
        });
    }

    function loadReviewsTab(response, loadMore) {

        if (loadMore) {
            currentlyVisibleReviewsNo += response.result.reviews.length;
        } else {
            document.getElementById("review-entries").innerHTML = '';
            currentlyVisibleReviewsNo = response.result.reviews.length;
            allReviewsExpanded = false;
        }

        if  (currentlyVisibleReviewsNo >= response.result.count) {
            document.getElementById("load-more-reviews-main").innerHTML = '';
        } else {
            document.getElementById("load-more-reviews-main").innerHTML = '<div class="card">'
                + '<div class="content"> '
                + '<div class="text-center row"> '
                + '<button id="load-more-reviews" class="btn btn-info btn-fill" type="submit" onclick="loadMore()" data-i18n-key="load-more">Încarcă mai multe rezultate</button>'
                + '</div> '
                + '</div> '
                + '</div>';
        }

        if (response.result.reviews.length == 0) {
            document.getElementById("review-entries").innerHTML = '<div class="text-center text-muted"> <h4>No reviews found</h4> </div>';
        }

        var facultyIds = response.result.reviews.map(r => r.facultyId);
        var backendUrlFaculties = new URL(backendUrlRoot + "/v1/faculty");
        backendUrlFaculties.searchParams.append("facultyIds", facultyIds);
        backendUrlFaculties.searchParams.append("limit", 999);

        $.ajax({
            url: backendUrlFaculties,
            type: "GET",
            success: function(facultyResponse) {

                if (facultyResponse.control.errorCode === 0) {

                var i;
                for (i in response.result.reviews) {

                    var facultyId = response.result.reviews[i].facultyId;
                    var faculty = facultyResponse.result.faculties.filter(f => facultyId === f.facultyId)[0];

                    var facultyUrl = facultyProfileUrl(faculty);

                    var facultyName = escapeHtml(faculty.facultyName);
                    var universityName = escapeHtml(faculty.universityName);
                    var facultyCity = escapeHtml(faculty.facultyCity);
                    var avgRating = faculty.avgRating;
                    if (!avgRating) {
                        avgRating = "N/A";
                    } else {
                        avgRating = avgRating.toFixed(1);
                    }

                    var countRev = faculty.countRev;
                    var countRevText;
                    if (!countRev) {
                        countRevText = "";
                    } else if (countRev === 1) {
                        countRevText = "<span data-i18n-key='from'>din</span> 1 <span data-i18n-key='review-v2'>evaluare</span>";
                    } else {
                        countRevText = "<span data-i18n-key='from'>din</span> " + countRev + " <span data-i18n-key='reviews-v2'>evaluări</span>";
                    }

                    var universityNameForLogo = universityName.replaceAll("\"", "_");
                    var logoName = facultyName + universityNameForLogo;
                    var logoSrc = backendUrlRoot + "/v1/faculty/" + faculty.facultyId + "/logo";

                    var savedFacultiesIds = getUField("usf");
                    var favoriteClass;
                    var favoriteTooltipText;
                    var favoriteText;
                    if (savedFacultiesIds && savedFacultiesIds.includes(facultyId)) {
                        favoriteClass = "fas fa-heart fa-lg";
                        favoriteTooltipText = "Elimină";
                        favoriteText = "Salvată";
                    } else {
                        favoriteClass = "far fa-heart fa-lg";
                        favoriteTooltipText = "Salvează";
                        favoriteText = "Salvează";
                    }

                    var searchCompareString1;
                    var searchCompareString2;
                    if ($(window).width() > 992) {
                        searchCompareString1 = '<div class="col-xs-1">			<div data-toggle="tooltip" title="' + favoriteTooltipText + '"  class="text-center" style="margin-top:10px;">					<button class="btn-danger btn btn-simple save" onclick="addToFavorites(this, &quot;'+facultyId+'&quot;, false)"><i class="' + favoriteClass + '" style="margin-right: 7px"></i></button>												</div>	<div data-toggle="tooltip" title="Compară" class="text-center" style="margin-top:85px;">													<button class="compare btn btn-simple" onclick="addToCompare(this, &quot;'+facultyId+'&quot;, false)"><i class="fas fa-plus-circle fa-lg" style="margin-right: 7px; "></i></button>												</div>				</div>';
                        searchCompareString2 = '';
                    } else {
                        searchCompareString1 = '';
                        searchCompareString2 = '<div class="row save-compare-search-list"> <div class="col-xs-6"> <button class="btn-danger btn btn-simple save" onclick="addToFavorites(this, &quot;'+facultyId+'&quot;, false)"><i class="' + favoriteClass + '" style="margin-right: 7px"></i><span>' + favoriteText + '</span></button> </div> <div class="col-xs-6 text-right" > <button class="btn btn-simple compare" onclick="addToCompare(this, &quot;'+facultyId+'&quot;, false)"><i class="fas fa-plus-circle fa-lg" style="margin-right: 7px; "></i><span>Compară</span> </button></div> </div>	';
                    }

                    var reviewId = response.result.reviews[i].reviewId;
                    var userName = escapeHtml(response.result.reviews[i].userName ? response.result.reviews[i].userName : "");
                    var formattedReviewDate = response.result.reviews[i].formattedReviewDate ? response.result.reviews[i].formattedReviewDate : "N/A";
                    var userStatus = response.result.reviews[i].userStatus ? response.result.reviews[i].userStatus.toLowerCase() : "";
                    if (userStatus === 'drop-out') {
                        userStatus = "";
                    }
                    var userDomainOfLicenseOrMaster = response.result.reviews[i].userDomainOfLicenseOrMaster ? response.result.reviews[i].userDomainOfLicenseOrMaster : "";
                    var userProgramName = response.result.reviews[i].userProgramName ? response.result.reviews[i].userProgramName : "";
                    var userYear = response.result.reviews[i].userYear ? response.result.reviews[i].userYear : "";
                    var userDetailsString = escapeHtml(userStatus + (userYear ? " - " + userYear : "") + (userDomainOfLicenseOrMaster ? " - " + userDomainOfLicenseOrMaster : "") + (userProgramName ? " - " + userProgramName : ""));
                    var upvotes = response.result.reviews[i].upvotes ? response.result.reviews[i].upvotes : 0;
                    var wouldRecommend = response.result.reviews[i].wouldRecommend;
                    var wouldRecommendText;
                    var wouldRecommendBoxClass;
                    var wouldRecommendTextClass;
                    var wouldRecommendTranslation;
                    if (wouldRecommend === true) {
                        wouldRecommendText = "Ar recomanda";
                        wouldRecommendBoxClass = "box green";
                        wouldRecommendTextClass = "would-recommend-text";
                        wouldRecommendTranslation = "would-recommend";
                    } else if (wouldRecommend === false) {
                        wouldRecommendText = "Nu ar recomanda";
                        wouldRecommendBoxClass = "box red";
                        wouldRecommendTextClass = "would-not-recommend-text";
                        wouldRecommendTranslation = "would-not-recommend";
                    } else {
                        wouldRecommendText = "";
                        wouldRecommendBoxClass = "";
                        wouldRecommendTextClass = "";
                        wouldRecommendTranslation = "";
                    }

                    var difficulty = response.result.reviews[i].difficulty;
                    var difficultyText;
                    if (difficulty) {
                        difficultyText = ':&nbsp' + difficulty + '/5';
                    } else {
                        difficultyText = ": N/A";
                    }
                    var wouldRecommendAndDifficultyRowString;
                    if (wouldRecommendText || difficulty) {
                        var recommendBadgeClass = wouldRecommend === true ? 'recommend' : (wouldRecommend === false ? 'not-recommend' : 'neutral');
                        var recommendBadgeIcon = wouldRecommend === true ? 'fa-thumbs-up' : (wouldRecommend === false ? 'fa-thumbs-down' : '');
                        wouldRecommendAndDifficultyRowString =
                            '<div class="review-badges-row">'
                            + (wouldRecommendText ? '<span class="review-badge ' + recommendBadgeClass + '"><i class="fa ' + recommendBadgeIcon + '"></i><span data-i18n-key=' + wouldRecommendTranslation + '>' + wouldRecommendText + '</span></span>' : '')
                            +'<span class="review-badge neutral"><span data-i18n-key="difficulty">Dificultate</span>' + difficultyText + '</span>'
                            +'</div>';
                    } else {
                        wouldRecommendAndDifficultyRowString = "";
                    }

                    var upvotedReviewsIds = getUField("ulr");
                    var upvotedRevClass;
                    var upvotedRevText;
                    if (upvotedReviewsIds && upvotedReviewsIds.includes(reviewId)) {
                        upvotedRevClass = "fas fa-thumbs-up fa-lg like-review align";
                    } else {
                        upvotedRevClass = "far fa-thumbs-up fa-lg like-review align";
                    }

                    var reviewAnswer = escapeHtml(response.result.reviews[i].reviewAnswerText);
                    var replyAreaString = "";
                    if (reviewAnswer && reviewAnswer != "") {
                        replyAreaString =
                            '<div id="reply-area" class="row">'
                                +'<div class="col-xs-12 col-md-12">'
                                    +'<div class="reply-line col-xs-1">'
                                    +'</div>'
                                    +'<div class="col-xs-11">'
                                        +'<div class="card">'
                                            +'<div class="content">'
                                            +'<b>' + facultyName + '</b>&nbsp;<i class="fa fa-check-circle" style="color: #2e3fc2" aria-hidden="true"></i>'
                                            + '<br>'
                                            + '<br>'
                                            +'<p>' + reviewAnswer + '</p>'
                                            +'</div>'
                                        +'</div>'
                                    +'</div>'
                                +'</div>'
                            +'</div>';
                    }


                    var generalRating = response.result.reviews[i].generalRating ? response.result.reviews[i].generalRating : "N/A";
                    var reviewText = escapeHtml(response.result.reviews[i].reviewText ? response.result.reviews[i].reviewText : "N/A");

                    var jobProspectsReviewCategory = response.result.reviews[i].jobProspectsReview;
                    var jobProspectsReviewRating = (jobProspectsReviewCategory && jobProspectsReviewCategory.generalRating) ? jobProspectsReviewCategory.generalRating : "N/A";
                    var jobProspectsReviewText = escapeHtml((jobProspectsReviewCategory && jobProspectsReviewCategory.reviewText) ? jobProspectsReviewCategory.reviewText : "");

                    var coursesAndLecturersReviewCategory = response.result.reviews[i].coursesAndLecturersReview;
                    var coursesAndLecturersReviewRating = (coursesAndLecturersReviewCategory && coursesAndLecturersReviewCategory.generalRating) ? coursesAndLecturersReviewCategory.generalRating : "N/A";
                    var coursesAndLecturersReviewText = escapeHtml((coursesAndLecturersReviewCategory && coursesAndLecturersReviewCategory.reviewText) ? coursesAndLecturersReviewCategory.reviewText : "");

                    var studentOrganisationsReviewCategory = response.result.reviews[i].studentOrganisationsReview;
                    var studentOrganisationsReviewRating = (studentOrganisationsReviewCategory && studentOrganisationsReviewCategory.generalRating) ? studentOrganisationsReviewCategory.generalRating : "N/A";
                    var studentOrganisationsReviewText = escapeHtml((studentOrganisationsReviewCategory && studentOrganisationsReviewCategory.reviewText) ? studentOrganisationsReviewCategory.reviewText : "");

                    var accomodationReviewCategory = response.result.reviews[i].accomodationReview;
                    var accomodationReviewRating = (accomodationReviewCategory && accomodationReviewCategory.generalRating) ? accomodationReviewCategory.generalRating : "N/A";
                    var accomodationReviewText = escapeHtml((accomodationReviewCategory && accomodationReviewCategory.reviewText) ? accomodationReviewCategory.reviewText : "");

                    var facultyFacilitiesReviewCategory = response.result.reviews[i].facultyFacilitiesReview;
                    var facultyFacilitiesReviewRating = (facultyFacilitiesReviewCategory && facultyFacilitiesReviewCategory.generalRating) ? facultyFacilitiesReviewCategory.generalRating : "N/A";
                    var facultyFacilitiesReviewText = escapeHtml((facultyFacilitiesReviewCategory && facultyFacilitiesReviewCategory.reviewText) ? facultyFacilitiesReviewCategory.reviewText : "");

                    <!-- var studentSupportReviewCategory = response.result.reviews[i].studentSupportReview; -->
                    <!-- var studentSupportReviewRating = (studentSupportReviewCategory && studentSupportReviewCategory.generalRating) ? studentSupportReviewCategory.generalRating : "N/A"; -->
                    <!-- var studentSupportReviewText = (studentSupportReviewCategory && studentSupportReviewCategory.reviewText) ? studentSupportReviewCategory.reviewText : ""; -->

                    var timeBalanceReviewCategory = response.result.reviews[i].timeBalanceReview;
                    var timeBalanceReviewRating = (timeBalanceReviewCategory && timeBalanceReviewCategory.generalRating) ? timeBalanceReviewCategory.generalRating : "N/A";
                    var timeBalanceReviewText = escapeHtml((timeBalanceReviewCategory && timeBalanceReviewCategory.reviewText) ? timeBalanceReviewCategory.reviewText : "");

                    var cardBegin = '<div class="card">'
                        +'				<div class="content">';
                    var cardEnd = '		</div>'
                        +'			</div>';

    function viewMore(i) {
        var moreText = document.getElementById("view-more-text-" + i);
        var btnText = document.getElementById("view-more-button-" + i);

        if (moreText.style.display === "none") {
            btnText.innerHTML = "- Vezi mai putin";
            moreText.style.display = "inline";
            btnText.setAttribute("data-i18n-key", "see-less");
        } else {
            btnText.innerHTML = "+ Vezi tot";
            moreText.style.display = "none";
            btnText.setAttribute("data-i18n-key", "see-all");
        }

        translateElement(btnText);
    }

    function toggleExpandAllReviews() {
        allReviewsExpanded = !allReviewsExpanded;
        applyExpandAllState();
    }

    // Master switch for viewMore(i): forces every currently rendered review card
    // to the same expanded/collapsed state, rather than toggling each one's own
    // state independently. Re-applied after every render (including load more)
    // so newly appended cards stay in sync with the last chosen state.
    function applyExpandAllState() {
        var moreTexts = document.querySelectorAll('[id^="view-more-text-"]');
        var moreButtons = document.querySelectorAll('[id^="view-more-button-"]');
        var i;
        for (i = 0; i < moreTexts.length; i++) {
            moreTexts[i].style.display = allReviewsExpanded ? "inline" : "none";
        }
        for (i = 0; i < moreButtons.length; i++) {
            if (allReviewsExpanded) {
                moreButtons[i].innerHTML = "- Vezi mai putin";
                moreButtons[i].setAttribute("data-i18n-key", "see-less");
            } else {
                moreButtons[i].innerHTML = "+ Vezi tot";
                moreButtons[i].setAttribute("data-i18n-key", "see-all");
            }
            translateElement(moreButtons[i]);
        }

        var toggleButtonLabel = document.querySelector("#toggle-expand-all-button span");
        if (toggleButtonLabel) {
            if (allReviewsExpanded) {
                toggleButtonLabel.innerHTML = "- Restrânge toate evaluările";
                toggleButtonLabel.setAttribute("data-i18n-key", "collapse-all-reviews");
            } else {
                toggleButtonLabel.innerHTML = "+ Extinde toate evaluările";
                toggleButtonLabel.setAttribute("data-i18n-key", "expand-all-reviews");
            }
            translateElement(toggleButtonLabel);
        }
    }

    function getRecentlyViewedFaculties() {

        if (typeof(Storage) == "undefined") {
            return;
        }

        var facultyIdsString = localStorage.getItem("rvi");
        var facultyIds;
        if (facultyIdsString) {
            facultyIds = facultyIdsString.split(",");
        }
        if (!facultyIds || facultyIds.length === 0) {
            document.getElementById("recently-viewed-faculties").innerHTML = '';
            document.getElementById("recent-faculties-section").style.padding = '0px';
            return;
        }

        var limit = 16;
        var backendUrl = new URL(backendUrlRoot + "/v1/faculty");
        backendUrl.searchParams.append("facultyIds", facultyIds.join());
        backendUrl.searchParams.append("limit", limit);

        $.ajax({
            url: backendUrl,
            type: "GET",
            beforeSend : function(request) {
                document.getElementById("recently-viewed-faculties").innerHTML = '	<div class="text-center" style="height: 350px;">'
                    +'<div class="uil-reload-css reload-background" style=""><div></div></div>'
                    +'</div>';

            },
            success: function(response) {
                if (response.control.errorCode === 0) {
                    var facultyIdsCopy = facultyIds.slice();
                    var sortedResponse = response.result.faculties.map(function(item) {
                        var n = facultyIdsCopy.indexOf(item.facultyId);
                        facultyIdsCopy[n] = '';
                        return [n, item]
                    }).sort(function (a, b) { return a[0] - b[0];  }).map(function(j) { return j[1] });
                    sortedResponse = sortedResponse.reverse();
                    loadRecentlyViewedFacultiesContent(sortedResponse);
                } else {
                    console.log(response.control.errorDescription);
                }

            },
            error: function(error) {
                checkLoggedInUser(error.status);
            }
        });
    }

    function loadRecentlyViewedFacultiesContent(sortedResponse) {

        var faculties = sortedResponse;

        if (faculties.length == 0 ) {
            document.getElementById("recently-viewed-faculties").innerHTML = '';
            document.getElementById("recent-faculties-section").style.padding = '0px';
            return;
        }


        var recentFacultiesString =
            '						<div class="row">'
            +'							<div class="col-xs-12">'
            +'								<h4 class="title">Recent vizualizate</h4>         '
            +'							</div>'
            +'						</div>';

        var windowWidth = $(window).width();
        var colWidth;
        var recentFacultiesPerSlide;
        if (windowWidth > 1200) {
            colWidth = 'col-md-3';
            recentFacultiesPerSlide = 4;
        } else if (windowWidth > 992) {
            colWidth = 'col-md-4';
            recentFacultiesPerSlide = 3;
        } else if (windowWidth > 768) {
            colWidth = 'col-sm-6';
            recentFacultiesPerSlide = 2;
        } else {
            colWidth = 'col-xs-12';
            recentFacultiesPerSlide = 1;
        }

        recentFacultiesString +=
            '						<div class="row">'
            +'							<div class="col-md-12">'
            +'							  <div class="carousel slide media-carousel" id="media">'
            +'								<div id="recent-faculties-carousel" class="carousel-inner">';

        var i;
        for (i in faculties) {

            if (i == 0) {
                recentFacultiesString += (
                    '						<div class="item active">'
                    +'							<div class="row">');
            }
            if (i!=0 && (i%recentFacultiesPerSlide)==0) {
                recentFacultiesString += (
                    '						<div class="item">'
                    +'							<div class="row">');
            }
            var faculty = faculties[i];
            var universityNameFront;
            var universityName = escapeHtml(faculty.universityName);
            if (universityName.length > 50) {
                universityNameFront = universityName.substring(0, 50).concat('...');
            } else {
                universityNameFront = universityName;
            }
            var universityNameTooltipTitle = universityName.replaceAll("\"", "");

            var avgRating = faculties[i].avgRating;
            if (!avgRating) {
                avgRating = "N/A";
            } else {
                avgRating = avgRating.toFixed(1);
            }

            var logoSrc = backendUrlRoot + "/v1/faculty/" + faculties[i].facultyId + "/logo";

            var facultyUrl = facultyProfileUrl(faculty);

            recentFacultiesString += (
                '<div class="' + colWidth + '"><div class="card inner-card"> <div class="content"> <div class="row"> <div class="col-xs-6 col-xs-offset-3"> <a href="' + facultyUrl + '"> <div class="img-faculty-logo-block-base img-faculty-logo-carousel-block"> <img id="logo" src="' + logoSrc + '" class="img-faculty-logo-base img-faculty-logo-carousel center"></img> </div> </a> </div> <div class="col-xs-12" style="margin-top: 15px; height: 170px;"> <a href="' + facultyUrl + '"> <h5><strong>' + escapeHtml(faculty.facultyName) + '</strong></h5> </a> <small data-toggle="tooltip" title="' + universityNameTooltipTitle + '">' + universityNameFront + '</small> <br> <small class="text-muted">' + escapeHtml(faculty.facultyCity) + '</small> <br> <a data-toggle="tooltip" title="Vezi evaluări" onclick="goToReviews(&quot;'+faculty.facultyId+'&quot;)"> <i class="fa fa-star rating-suggestion-card" style="color: orange"></i> <strong style="color: orange">' + avgRating + '</strong> </a> </div>  </div> </div> </div> </div>');

            if (i==(faculties.length - 1) || i%recentFacultiesPerSlide==(recentFacultiesPerSlide-1)) {
                recentFacultiesString += ('</div> </div>');
            }

        }

        recentFacultiesString +=
            '								</div>'
            +'								<a data-slide="prev" href="#media" class="left carousel-control">‹</a>'
            +'								<a data-slide="next" href="#media" class="right carousel-control">›</a>'
            +'							  </div>    '
            +'							</div>'
            +'						</div>';

        document.getElementById("recently-viewed-faculties").innerHTML = recentFacultiesString;

        $('#media').carousel('pause');

    }
