<script>

const backendUrlRoot = "https://unistart.ro/Jamstudy";

$wrapper = $("#wrapper");
$(document).on({
    ajaxStop: function() {
		translatePage();
		$wrapper.removeClass("loading");
		document.getElementById("main-loading").style.display = "none";
	}
});

var facultyId;

$(document).ready(function() {

	getPageHeader();
	getPageFooter();
	myAccountText();
	getLoginModal();
	getRegisterModal();

	loadUser();
	var queryParams = new URLSearchParams(window.location.search);
	facultyId = queryParams.get("faculty");

	loadFaculty();

	updateCharCounter(document.getElementById("question-title"), "question-title-counter");
	updateCharCounter(document.getElementById("question-text"), "question-text-counter");

});

window.onload = function() {
	translatePlaceholders();
};

function updateCharCounter(field, counterId) {
	document.getElementById(counterId).innerHTML = field.value.length + " / " + field.maxLength;
}

function translatePlaceholders() {
	document.getElementById("question-title").setAttribute("placeholder", translateKey("qa-ask-question-title-placeholder"));
	document.getElementById("question-text").setAttribute("placeholder", translateKey("qa-ask-question-text-placeholder"));
}

function loadFaculty() {
	var backendUrl = new URL(backendUrlRoot + "/v1/faculty/" + facultyId);

	$.ajax({
	  url: backendUrl,
	  type: "GET",
	  success: function(response) {

		if (response.control.errorCode === 0) {
			var facultyName = escapeHtml(response.result.facultyName);
			var logoSrc = backendUrlRoot + "/v1/faculty/" + response.result.facultyId + "/logo";
			var urlProfileRedirect = facultyProfileUrl(response.result);

			document.getElementById("ask-question-faculty-main").innerHTML = (
							'<div class="row">'
							+'	<div class="col-md-2 col-md-offset-5 col-sm-4 col-sm-offset-4 col-xs-6 col-xs-offset-3">'
							+'			<a href="' + urlProfileRedirect + '">		'
							+'				<div class="img-faculty-logo-block-base img-faculty-add-review-logo-block">'
							+'					<img id="ask-question-faculty-logo" class="img-faculty-logo-base img-faculty-logo-add-review center-add-review" src="' + logoSrc + '"></img>'
							+'				</div>'
							+'			</a>'
							+'	</div>'
							+'	<div class="form-group col-md-6 col-md-offset-3 col-xs-12" style="display:inline; vertical-align: middle; margin-top: 15px;">'
							+'		<input id="ask-question-faculty-name" type="text" value="' + facultyName + '" class="form-control" readonly/>'
							+'	</div>'
							+'</div>'
							);

		}
	  },
	  error: function(error) {
		checkLoggedInUser(error.status)
	  }
	});
}

function postQuestion() {

	if (!getUField("ut")) {
		$("#login-modal").modal('show');
		return;
	}

	var title = document.getElementById("question-title").value;
	var questionText = document.getElementById("question-text").value;

	var question = {
		title: title,
		questionText: questionText
	};

	var backendUrl = new URL(backendUrlRoot + "/v1/question/" + facultyId);

	$("#ask-question-modal").modal();
	document.getElementById('ask-question-modal-text').innerHTML = "Se procesează...";

	$.ajax({
		url: backendUrl,
		type: 'POST',
		dataType: 'json',
		contentType: 'application/json',
		crossDomain: true,
		data: JSON.stringify(question),
		success: function (data) {
			document.getElementById('ask-question-modal-text').innerHTML = "Întrebarea a fost adăugată cu succes.";
			$("#ask-question-modal").on("hidden.bs.modal", function () {
				window.location.replace(facultyProfileUrl(facultyId) + "#qa");
			});
		},
		error: function(error) {
			checkLoggedInUser(error.status);
			document.getElementById('ask-question-header-text').innerHTML = '<i class="fas fa-exclamation-triangle fa-2x"></i>';

			if (error.status == 406 && error.responseJSON && error.responseJSON.control) {
				document.getElementById('ask-question-modal-text').innerHTML = error.responseJSON.control.errorDescription;
			} else {
				document.getElementById('ask-question-modal-text').innerHTML = "A apărut o eroare. Întrebarea nu a putut fi adăugată.";
			}
		}
	});
}

</script>
