function getFaculties() {

	document.getElementById("loading").style.display = "inline-block";
	document.getElementById("comparison-table").innerHTML = '';
	document.getElementById("comparison-table").style.border = "none";

	var backendUrl = new URL(backendUrlRoot + "/v1/faculty/details");

	if (typeof(Storage) == "undefined") {
		return;
	}

	var facultyIdsString = localStorage.getItem("fci");
	var facultyIds;
	if (facultyIdsString) {
		facultyIds = facultyIdsString.split(",");
	}
	if (!facultyIds || facultyIds.length === 0) {
		document.getElementById("comparison-table").innerHTML = '<div class="text-center text-muted center"> <h4 data-i18n-key="compare-add-faculty">Adaugă o facultate pentru a începe</h4><a href="./search.html"utton class="btn btn-info btn-block btn-fill" data-i18n-key="compare-search-faculties">Caută Facultăți</a> </div>';
		document.getElementById("comparison-table").style.height = "500px";
		<!-- document.getElementById("comparison-table").style.width = "1200px"; -->
		document.getElementById("comparison-table").style.border = "none";
		document.getElementById("loading").style.display = "none";
		var universityIds = ['UNI_JBCh5VDZkN', 'UNI_2pdZxarJlM', 'UNI_7qEOSdaLJ7', 'UNI_88N6eRLyXm', "UNI_ossXtvkhcj"]; // default recommended universityIds
		getRecommendedFaculties(universityIds, facultyIds);
		renderComparisonRadarChart([]);
		translatePage();
		return;
	}
	backendUrl.searchParams.append("facultyIds", facultyIds.join());
	
	
	  $.ajax({
	  url: backendUrl,
	  type: "GET",
	  success: function(response) {
		if (response.control.errorCode === 0) {
		
			var universityIds = ['UNI_JBCh5VDZkN', 'UNI_2pdZxarJlM', 'UNI_7qEOSdaLJ7', 'UNI_88N6eRLyXm', "UNI_ossXtvkhcj"]; // default recommended universityIds
			var i;
			for (i in response.result.faculties) {
				if (!universityIds.includes(response.result.faculties[i].universityId)) {
					universityIds.push(response.result.faculties[i].universityId);
				}
			}
			getRecommendedFaculties(universityIds, facultyIds);
		
			var facultyIdsCopy = facultyIds.slice();
			var sortedResponse = response.result.faculties.map(function(item) {
			var n = facultyIdsCopy.indexOf(item.facultyId);
			facultyIdsCopy[n] = '';
			return [n, item]
			}).sort().map(function(j) { return j[1] });
			constructTable();
			loadComparisonTableContent(sortedResponse);
			renderComparisonRadarChart(sortedResponse);
		} else {
			console.log(response.control.errorDescription);
		}

		translatePage();

	  },
	  error: function(error) {
		checkLoggedInUser(error.status)
	  },
	  complete: function (data) {
		document.getElementById("loading").style.display = "none";
	  }
	});
}

// First 5 slots of the dataviz reference categorical palette. Only the first
// 3 pass all-pairs CVD validation on their own (this is an overlaid radar,
// where any two series can end up neighbors) — slots 4-5 fail the normal-vision
// and CVD floors against the others (validated via the dataviz skill's
// validate_palette.js), so they carry a stroke-dasharray as a secondary,
// color-independent identity cue. The always-visible legend (color + name)
// and the full data table elsewhere on the page are the required "relief"
// for the sub-3:1-contrast slots (aqua, yellow, magenta).
var RADAR_SERIES_COLORS = ['#2a78d6', '#eb6834', '#1baf7a', '#eda100', '#e87ba4'];
var RADAR_SERIES_DASH = ['', '', '', '7,4', '2,3'];
var RADAR_MAX_SERIES = 5;
// Hover state for the radar chart tooltip, populated by renderComparisonRadarChart().
// One entry per axis, each listing every faculty plotted on that axis — indices are
// referenced by the inline on* handlers below and stay valid until the next render.
var radarTooltipData = [];
var RADAR_CATEGORIES = [
	{ key: 'avgRatingCoursesAndLecturers', icon: 'fa-graduation-cap', i18nKey: 'review-professors-and-courses' },
	{ key: 'avgRatingJobProspects', icon: 'fa-briefcase', i18nKey: 'review-career-opportunities' },
	{ key: 'avgRatingAccomodation', icon: 'fa-home', i18nKey: 'review-acommodation' },
	{ key: 'avgRatingStudentOrganisations', icon: 'fa-users', i18nKey: 'review-student-associations' },
	{ key: 'avgRatingFacultyFacilities', icon: 'fa-building', i18nKey: 'review-facilities' },
	{ key: 'avgRatingTimeBalance', icon: 'fa-clock-o', i18nKey: 'review-study-time-vs-free-time' }
];

function renderComparisonRadarChart(faculties) {
	var container = document.getElementById("comparison-radar-chart");

	if (!faculties || faculties.length === 0) {
		container.innerHTML = "";
		container.style.display = "none";
		return;
	}
	container.style.display = "";

	var radarFaculties = faculties.slice(0, RADAR_MAX_SERIES);
	var extraCount = faculties.length - radarFaculties.length;

	var size = 420;
	var center = size / 2;
	var maxRadius = 130;
	var maxValue = 5;
	var numAxes = RADAR_CATEGORIES.length;
	var angleStep = (2 * Math.PI) / numAxes;
	var a, s;

	function angleFor(index) {
		return -Math.PI / 2 + index * angleStep;
	}
	function pointAtRadius(index, radius) {
		var angle = angleFor(index);
		return { x: center + radius * Math.cos(angle), y: center + radius * Math.sin(angle) };
	}
	function pointForValue(index, value) {
		return pointAtRadius(index, (value / maxValue) * maxRadius);
	}

	// Precompute every series' value/position per axis once, shared by the polygons
	// below and by the hover tooltips (one tooltip per axis, listing every faculty
	// plotted on that axis so nearby/overlapping points never hide each other).
	var axisData = [];
	for (a = 0; a < numAxes; a++) {
		var axisEntries = [];
		for (s = 0; s < radarFaculties.length; s++) {
			var faculty = radarFaculties[s];
			var rawValue = faculty[RADAR_CATEGORIES[a].key];
			var value = rawValue ? rawValue : 0;
			var vertexPoint = pointForValue(a, value);
			axisEntries.push({ facultyName: faculty.facultyName, value: rawValue, x: vertexPoint.x, y: vertexPoint.y, color: RADAR_SERIES_COLORS[s] });
		}
		axisData.push({ category: RADAR_CATEGORIES[a], entries: axisEntries });
	}

	// Gridline rings at 1..5 — hairline, recessive, never dashed.
	var gridRingsSvg = "";
	for (var ring = 1; ring <= maxValue; ring++) {
		var ringPoints = [];
		for (a = 0; a < numAxes; a++) {
			var ringPoint = pointForValue(a, ring);
			ringPoints.push(ringPoint.x + ',' + ringPoint.y);
		}
		gridRingsSvg += '<polygon points="' + ringPoints.join(' ') + '" fill="none" stroke="#e1e0d9" stroke-width="1"/>';
	}

	// Axis spokes + category labels (icon reused from the profile/comparison category rows).
	var axesSvg = "";
	var labelsHtml = "";
	for (a = 0; a < numAxes; a++) {
		var outerPoint = pointAtRadius(a, maxRadius);
		axesSvg += '<line x1="' + center + '" y1="' + center + '" x2="' + outerPoint.x + '" y2="' + outerPoint.y + '" stroke="#c3c2b7" stroke-width="1"/>';

		var labelPoint = pointAtRadius(a, maxRadius + 44);
		var category = RADAR_CATEGORIES[a];
		labelsHtml +=
			'<div style="position: absolute; width: 100px; left: ' + labelPoint.x + 'px; top: ' + labelPoint.y + 'px; transform: translate(-50%, -50%); text-align: center; font-size: 12px; color: #52514e;">'
			+	'<i class="fa ' + category.icon + '" style="color: #898781;"></i><br>'
			+	'<span data-i18n-key="' + category.i18nKey + '"></span>'
			+ '</div>';
	}

	// One polygon per faculty, in the fixed CVD-safe slot order.
	var seriesSvg = "";
	var legendHtml = "";
	for (s = 0; s < radarFaculties.length; s++) {
		var faculty = radarFaculties[s];
		var color = RADAR_SERIES_COLORS[s];
		var dash = RADAR_SERIES_DASH[s];
		var polygonPoints = [];
		for (a = 0; a < numAxes; a++) {
			var seriesEntry = axisData[a].entries[s];
			polygonPoints.push(seriesEntry.x + ',' + seriesEntry.y);
		}
		seriesSvg += '<polygon points="' + polygonPoints.join(' ') + '" fill="' + color + '" fill-opacity="0.1" stroke="' + color + '" stroke-width="2"' + (dash ? ' stroke-dasharray="' + dash + '"' : '') + '/>';

		if (radarFaculties.length > 1) {
			var swatchBorder = dash ? 'border: 2px dashed ' + color + '; background: transparent;' : 'background: ' + color + ';';
			legendHtml +=
				'<span style="display: inline-flex; align-items: center; margin: 0 12px;">'
				+	'<span style="display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; ' + swatchBorder + '"></span>'
				+	'<span>' + escapeHtml(faculty.facultyName) + '</span>'
				+ '</span>';
		}
	}

	// Vertex dots (visible, colored) plus a larger invisible hover target on top of
	// each one. Hovering any dot on an axis shows one tooltip listing every faculty
	// plotted on that axis, so nearby/overlapping points never hide each other.
	var dotsSvg = "";
	var hoverSvg = "";
	radarTooltipData = [];
	for (a = 0; a < numAxes; a++) {
		var axisEntries2 = axisData[a].entries;
		var tooltipIndex = radarTooltipData.length;
		radarTooltipData.push({ categoryI18nKey: axisData[a].category.i18nKey, entries: axisEntries2 });
		for (var e = 0; e < axisEntries2.length; e++) {
			var dotEntry = axisEntries2[e];
			dotsSvg += '<circle cx="' + dotEntry.x + '" cy="' + dotEntry.y + '" r="4" fill="' + dotEntry.color + '" stroke="#fcfcfb" stroke-width="2" style="pointer-events: none;"/>';
			hoverSvg += '<circle cx="' + dotEntry.x + '" cy="' + dotEntry.y + '" r="10" fill="transparent" style="pointer-events: all; cursor: pointer;" onmouseenter="showRadarTooltip(event, ' + tooltipIndex + ')" onmousemove="moveRadarTooltip(event)" onmouseleave="hideRadarTooltip()"></circle>';
		}
	}

	var titleHtml = radarFaculties.length === 1
		? '<h4 class="text-center">' + escapeHtml(radarFaculties[0].facultyName) + '</h4>'
		: '<h4 class="text-center" data-i18n-key="compare-radar-title">Comparație vizuală</h4>';

	var extraNoteHtml = extraCount > 0
		? '<p class="text-center text-muted"><small><span data-i18n-key="compare-radar-max-faculties">Notă: graficul arată doar primele 5 facultăți (maxim) din tabel</span></small></p>'
		: '';

	container.innerHTML =
		'<div class="col-xs-12">'
		+			titleHtml
		+			'<div style="position: relative; width: ' + size + 'px; max-width: 100%; margin: 0 auto;">'
		+				'<svg width="' + size + '" height="' + size + '" viewBox="0 0 ' + size + ' ' + size + '" style="max-width: 100%; height: auto;">'
		+					gridRingsSvg
		+					axesSvg
		+					seriesSvg
		+					dotsSvg
		+					hoverSvg
		+				'</svg>'
		+				labelsHtml
		+				'<div id="radar-tooltip" class="tooltip-inner" style="display: none; position: absolute; z-index: 20; pointer-events: none; text-align: left; white-space: nowrap; width: max-content; max-width: none;"></div>'
		+			'</div>'
		+			'<div class="text-center" style="margin-top: 10px;">' + legendHtml + '</div>'
		+			extraNoteHtml
		+ '</div>';

	translatePage();
}

function showRadarTooltip(evt, index) {
	var data = radarTooltipData[index];
	var tooltip = document.getElementById('radar-tooltip');
	if (!data || !tooltip) {
		return;
	}
	var categoryLabel = translateKey(data.categoryI18nKey) || '';
	var html = '<div style="font-weight: 600; margin-bottom: 4px;">' + escapeHtml(categoryLabel) + '</div>';
	for (var i = 0; i < data.entries.length; i++) {
		var entry = data.entries[i];
		var displayValue = entry.value ? entry.value.toFixed(1) : 'N/A';
		html +=
			'<div style="display: flex; align-items: center; gap: 6px;">'
			+	'<span style="width: 8px; height: 8px; border-radius: 50%; background: ' + entry.color + '; display: inline-block; flex: none;"></span>'
			+	'<span>' + escapeHtml(entry.facultyName) + ': ' + displayValue + '</span>'
			+ '</div>';
	}
	tooltip.innerHTML = html;
	tooltip.style.display = 'block';
	positionRadarTooltip(evt);
}

function moveRadarTooltip(evt) {
	var tooltip = document.getElementById('radar-tooltip');
	if (tooltip && tooltip.style.display === 'block') {
		positionRadarTooltip(evt);
	}
}

function positionRadarTooltip(evt) {
	var tooltip = document.getElementById('radar-tooltip');
	var wrapper = tooltip && tooltip.parentElement;
	if (!tooltip || !wrapper) {
		return;
	}
	var rect = wrapper.getBoundingClientRect();
	var x = evt.clientX - rect.left;
	var y = evt.clientY - rect.top;
	tooltip.style.left = (x + 14) + 'px';
	tooltip.style.top = (y - 14) + 'px';
}

function hideRadarTooltip() {
	var tooltip = document.getElementById('radar-tooltip');
	if (tooltip) {
		tooltip.style.display = 'none';
	}
}

function constructTable() {
	var collColumnWidth = "col-xs-3";
	
	if ($(window).width() > 992) {
		$('.comparison-table').scroll(function() {
			$(this).find('.comparison-header-cell').css('left', $(this).scrollLeft());
		});
		$('.comparison-table').scroll(function() {
			$(this).find('.comparison-header-cell-blank').css('left', $(this).scrollLeft());
		});
		$('.comparison-table').scroll(function() {
			document.getElementById('comparison-table-top-scroll').scrollLeft = this.scrollLeft;
		});
		$('#comparison-table-top-scroll').scroll(function() {
			document.getElementById('comparison-table').scrollLeft = this.scrollLeft;
		});
	}

		document.getElementById("comparison-table").style.height = "";
		document.getElementById("comparison-table").innerHTML = (
'								<div class="col-md-12 col-md-offset-0">'
+'									<div id="faculty-name-row" class="comparison-row comparison-even-row row"> '
+'									<div class="comparison-cell comparison-header-cell-blank ' + collColumnWidth + '"> '
+'									</div> '
+'									<div id="faculty-name-row-content" class="comparison-row-content"> '

function getRecommendedFaculties(universityIds, comparedFacultyIds) {

	var backendUrl = new URL(backendUrlRoot + "/v1/faculty");
	
	if (!universityIds || universityIds.length == 0) {
		return;
	}

	backendUrl.searchParams.append("universityIds", universityIds.join());
	backendUrl.searchParams.append("ratingFrom", 0); // set to 1
	backendUrl.searchParams.append("limit", 12);
	
	  $.ajax({
	  url: backendUrl,
	  type: "GET",
	  beforeSend : function(request) {
			document.getElementById("recommended-carousel").innerHTML = '	<div class="text-center" style="height: 350px;">'
																					+'<div class="uil-reload-css reload-background" style=""><div></div></div>'
																				+'</div>';
			
		  },
	  success: function(response) {
		if (response.control.errorCode === 0) {
			loadRecommendedFacultiesContent(response, comparedFacultyIds);
		} else {
			console.log(response.control.errorDescription);
		}

	  },
	  error: function(error) {
		checkLoggedInUser(error.status);
	  }
	});
}

function loadRecommendedFacultiesContent(response, comparedFacultyIds) {

	var faculties = response.result.faculties;
	if (comparedFacultyIds) {
		faculties = faculties.filter(function(value, index, arr){
			return !comparedFacultyIds.includes(value.facultyId);
		});
	}
	
	if (faculties.length == 0 ) {
		document.getElementById("recommended-carousel").innerHTML = '<div class="text-center text-muted" style="height: 150px;"> <h4>Nu au fost găsite sugestii</h4> </div>';
		return;
	}

	var windowWidth = $(window).width();
	var colWidth;
	var recommendedNumberPerSlide;
	if (windowWidth > 1200) {
		colWidth = 'col-md-3';
		recommendedNumberPerSlide = 4;
	} else if (windowWidth > 992) {
		colWidth = 'col-md-4';
		recommendedNumberPerSlide = 3;
	} else if (windowWidth > 768) {
		colWidth = 'col-sm-6';
		recommendedNumberPerSlide = 2;
	} else {
		colWidth = 'col-xs-12';
		recommendedNumberPerSlide = 1;
	}
	
	var recommendedFacultiesString;
	
	var i;
	for (i in faculties) {
	
			if (i == 0) {
				recommendedFacultiesString = (
		'						<div class="item active">'
		+'							<div class="row">');
			}
			if (i!=0 && (i%recommendedNumberPerSlide)==0) {
				recommendedFacultiesString += (
		'						<div class="item">'
		+'							<div class="row">');
			}
			var faculty = faculties[i];
			var universityNameFront;
			var universityName = escapeHtml(faculty.universityName);
			if (universityName.length > 50) {
				universityNameFront = universityName.substring(0, 50).concat('...');
			} else {
				universityNameFront = universityName;
			}
			var universityNameTooltipTitle = universityName.replaceAll("\"", "");
			
			var avgRating = faculty.avgRating;
			if (!avgRating) {
				avgRating = "N/A";
			} else {
				avgRating = avgRating.toFixed(1);
			}
			
			var logoSrc = backendUrlRoot + "/v1/faculty/" + faculty.facultyId + "/logo";	
			
			var facultyUrl = facultyProfileUrl(faculty);

			recommendedFacultiesString += (
						'<div class="' + colWidth + '"><div class="card inner-card"> <div class="content" style="height: 350px;"> <div class="row"> <div class="col-xs-6 col-xs-offset-3"> <a href="' + facultyUrl + '"> <div class="img-faculty-logo-block-base img-faculty-logo-carousel-block"> <img id="logo" src="' + logoSrc + '" class="img-faculty-logo-base img-faculty-logo-carousel center"></img> </div> </a> </div> <div class="col-xs-12" style="margin-top: 15px; height: 170px;"> <a href="' + facultyUrl + '"> <h5><strong>' + escapeHtml(faculty.facultyName) + '</strong></h5> </a> <small data-toggle="tooltip" title="' + universityNameTooltipTitle + '">' + universityNameFront + '</small> <br> <small class="text-muted">' + escapeHtml(faculty.facultyCity) + '</small> <br> <a data-toggle="tooltip" title="Vezi evaluări" onclick="goToReviews(&quot;'+faculty.facultyId+'&quot;)"> <i class="fa fa-star rating-suggestion-card" style="color: orange"></i> <strong style="color: orange">' + avgRating + '</strong> </a> </div> <div class="col-xs-12 text-center" style="margin-top: 10px;"> <button class="btn btn-simple compare compare-carousel" onclick="addToCompareTable(this, &quot;'+faculty.facultyId+'&quot;)"><i class="fas fa-plus-circle fa-lg" style="margin-right: 7px; "></i><span data-i18n-key="compare">Compară</span> </button></div> </div> </div> </div> </div>');

		if (i==(faculties.length - 1) || i%recommendedNumberPerSlide==(recommendedNumberPerSlide-1)) {
			recommendedFacultiesString += ('</div> </div>');
		}
		
	}
	
	document.getElementById("recommended-carousel").innerHTML = recommendedFacultiesString;

	translatePage();
	
	$('#media').carousel('pause');
	
}

function searchFacultiesToCompare() {
	var input = document.getElementById("compare-search-input").value;
	var resultsList = document.getElementById("compare-search-results");

	if (!input || input.length < 3) {
		resultsList.innerHTML = "";
		resultsList.style.display = "none";
		return;
	}

	var backendUrl = new URL(backendUrlRoot + "/v1/faculty");
	backendUrl.searchParams.append("searchBy", input);
	backendUrl.searchParams.append("orderBy", "viewsCount,desc");
	backendUrl.searchParams.append("limit", 15);

	fetch(backendUrl, {
		method: "GET",
		headers: {
			"Code": window.location.href.includes("unistart.lt") ? "LT" : "RO",
		}
	})
	.then(function(response) { return response.json(); })
	.then(function(data) {
		renderCompareSearchResults(data.result ? data.result.faculties : []);
	})
	.catch(function(error) {
		console.log(error);
	});
}

function renderCompareSearchResults(faculties) {
	var resultsList = document.getElementById("compare-search-results");

	var facultyIdsString = localStorage.getItem("fci");
	var alreadyAddedIds = facultyIdsString ? facultyIdsString.split(",") : [];

	var availableFaculties = faculties.filter(function(faculty) {
		return !alreadyAddedIds.includes(faculty.facultyId);
	}).slice(0, 7);

	if (availableFaculties.length === 0) {
		resultsList.innerHTML = '<li class="autocomplete-result" data-i18n-key="compare-search-no-results">Nu au fost găsite rezultate</li>';
		resultsList.style.display = "block";
		return;
	}

	var resultsHtml = "";
	var i;
	for (i in availableFaculties) {
		var faculty = availableFaculties[i];
		var facultyName = escapeHtml(faculty.facultyName);
		var universityName = escapeHtml(faculty.universityName);
		var logoSrc = backendUrlRoot + "/v1/faculty/" + faculty.facultyId + "/logo";

		resultsHtml +=
			'<li class="autocomplete-result" onclick="addToCompareTableFromSearch(&quot;' + faculty.facultyId + '&quot;)">'
			+	'<img src="' + logoSrc + '" style="height: 24px; width: 24px; object-fit: contain; margin-right: 8px; vertical-align: middle;">'
			+	'<b>' + facultyName + '</b> <span class="text-muted">' + universityName + '</span>'
			+ '</li>';
	}

	resultsList.innerHTML = resultsHtml;
	resultsList.style.display = "block";
	translatePage();
}

function addToCompareTableFromSearch(facultyId) {
	document.getElementById("compare-search-input").value = "";
	document.getElementById("compare-search-results").innerHTML = "";
	document.getElementById("compare-search-results").style.display = "none";
	addToCompareTable(null, facultyId);
}

function addToCompareTable(button, facultyId) {

	if (typeof(Storage) !== "undefined") {
		var facultyIdsString = localStorage.getItem("fci");
		var facultyIds;
		if (facultyIdsString) {
			facultyIds = facultyIdsString.split(",");
		} else {
			facultyIds = [];
		}
		if (facultyIds.length <= 20 && !facultyIds.includes(facultyId)) {
			facultyIds.push(facultyId);
		}
		localStorage.setItem("fci", facultyIds);
	} else {
	  // Sorry! No Web Storage support..
	}
	
	document.body.scrollTop = 0; // For Safari
	document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
	getFaculties();
	

}

function removeFromCompare(facultyId) {

	if (typeof(Storage) !== "undefined") {
		var facultyIdsString = localStorage.getItem("fci");
		var facultyIds;
		if (facultyIdsString) {
			facultyIds = facultyIdsString.split(",");
		} else {
			facultyIds = [];
		}
		if (facultyIds.includes(facultyId)) {
			facultyIds = facultyIds.filter(function(value, index, arr){ return value !== facultyId;});
		}
		localStorage.setItem("fci", facultyIds);
		
		getFaculties();
		
	} else {
	  // Sorry! No Web Storage support..
	}
}
