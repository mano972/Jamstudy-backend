function getFaculties() {

	document.getElementById("loading").style.display = "inline-block";
	document.getElementById("comparison-table").innerHTML = '';
	document.getElementById("comparison-table").style.border = "none";

	var backendUrl = new URL(backendUrlRoot + "/v1/faculty/details");

	if (typeof(Storage) == "undefined") {
		return;
	}

	var facultyIdsString = localStorage.getItem("fci");
	var facultyIds;
	if (facultyIdsString) {
		facultyIds = facultyIdsString.split(",");
	}
	if (!facultyIds || facultyIds.length === 0) {
		document.getElementById("comparison-table").innerHTML = '<div class="text-center text-muted center"> <h4 data-i18n-key="compare-add-faculty">Adaugă o facultate pentru a începe</h4><a href="./search.html"utton class="btn btn-info btn-block btn-fill" data-i18n-key="compare-search-faculties">Caută Facultăți</a> </div>';
		document.getElementById("comparison-table").style.height = "500px";
		<!-- document.getElementById("comparison-table").style.width = "1200px"; -->
		document.getElementById("comparison-table").style.border = "none";
		document.getElementById("loading").style.display = "none";
		var universityIds = ['UNI_JBCh5VDZkN', 'UNI_2pdZxarJlM', 'UNI_7qEOSdaLJ7', 'UNI_88N6eRLyXm', "UNI_ossXtvkhcj"]; // default recommended universityIds
		getRecommendedFaculties(universityIds, facultyIds);
		translatePage();
		return;
	}
	backendUrl.searchParams.append("facultyIds", facultyIds.join());
	
	
	  $.ajax({
	  url: backendUrl,
	  type: "GET",
	  success: function(response) {
		if (response.control.errorCode === 0) {
		
			var universityIds = ['UNI_JBCh5VDZkN', 'UNI_2pdZxarJlM', 'UNI_7qEOSdaLJ7', 'UNI_88N6eRLyXm', "UNI_ossXtvkhcj"]; // default recommended universityIds
			var i;
			for (i in response.result.faculties) {
				if (!universityIds.includes(response.result.faculties[i].universityId)) {
					universityIds.push(response.result.faculties[i].universityId);
				}
			}
			getRecommendedFaculties(universityIds, facultyIds);
		
			var facultyIdsCopy = facultyIds.slice();
			var sortedResponse = response.result.faculties.map(function(item) {
			var n = facultyIdsCopy.indexOf(item.facultyId);
			facultyIdsCopy[n] = '';
			return [n, item]
			}).sort().map(function(j) { return j[1] });
			constructTable();
			loadComparisonTableContent(sortedResponse);
		} else {
			console.log(response.control.errorDescription);
		}

		translatePage();

	  },
	  error: function(error) {
		checkLoggedInUser(error.status)
	  },
	  complete: function (data) {
		document.getElementById("loading").style.display = "none";
	  }
	});
}

function loadComparisonTableContent(sortedResponse) {

	var collColumnWidth = "col-xs-3";
	
	var cellWidth;
	if ($(window).width() > 992) {
		cellWidth = 300;
	} else {
		<!-- cellWidth = 150; -->
		cellWidth = 300;
	}
	var noOfFaculties = sortedResponse.length;
	var noOfFacultiesIncludingHeader = noOfFaculties + 1;
	var comparisonRowWidth = cellWidth * noOfFacultiesIncludingHeader;
	var comparisonTableWidth = (cellWidth * noOfFacultiesIncludingHeader) + 4; // in order to not show the scroll bar all the time
	
	var comparisonTableElement = document.getElementById('comparison-table');
	comparisonTableElement.style.maxWidth = comparisonTableWidth + "px";
	
	var comparisonRowElements = document.getElementsByClassName('comparison-row');
	var comparisonRowElementsLength = comparisonRowElements.length;

		comparisonRowElementsLength--;
		comparisonRowElements[comparisonRowElementsLength].style.width = comparisonRowWidth + "px";

	document.getElementById("university-name-row-content").innerHTML = '';
	document.getElementById("faculty-avgrating-row-content").innerHTML = '';
	document.getElementById("faculty-recommend-row-content").innerHTML = '';
	document.getElementById("faculty-difficulty-row-content").innerHTML = '';
	document.getElementById("faculty-courses-row-content").innerHTML = '';
	document.getElementById("faculty-jobs-row-content").innerHTML = '';
	document.getElementById("faculty-accommodation-row-content").innerHTML = '';
	document.getElementById("faculty-organisations-row-content").innerHTML = '';
	document.getElementById("faculty-facilities-row-content").innerHTML = '';
	document.getElementById("faculty-time-row-content").innerHTML = '';

	for (i in sortedResponse) {
		var facultyResponse = sortedResponse[i];
		
		var facultyId = facultyResponse.facultyId;
		var facultyName = facultyResponse.facultyName;
		var universityNameFront;
		var universityName = facultyResponse.universityName;
		if (universityName.length > 43) {
			universityNameFront = universityName.substring(0, 43).concat('...');
		} else {
			universityNameFront = universityName;
		}
		var universityNameTooltipTitle = universityName.replaceAll("\"", "");
		var facultyCity = facultyResponse.facultyCity;
		var facultyLogo = backendUrlRoot + "/v1/faculty/" + facultyResponse.facultyId + "/logo";	
		
		var avgRating = facultyResponse.avgRating ? facultyResponse.avgRating.toFixed(1) : "N/A";
		
		var countRev = facultyResponse.countRev;
		var countRevText;
		if (!countRev) {
			countRevText = "";
		} else if (countRev === 1) {
			countRevText = "(1 <span data-i18n-key='review-v2'>evaluare</span>)";
		} else {
			countRevText = "(" + countRev + " <span data-i18n-key='reviews-v2'>evaluare</span>)";
		}
		
		var wouldRecommend = facultyResponse.percentageWouldRecommend ? facultyResponse.percentageWouldRecommend.toFixed(0)+"%" : "N/A";
		var avgDifficulty = facultyResponse.avgDifficulty ? facultyResponse.avgDifficulty.toFixed(1) : "N/A";
		
		var avgRatingCoursesAndLecturers = facultyResponse.avgRatingCoursesAndLecturers ? facultyResponse.avgRatingCoursesAndLecturers.toFixed(1) : "N/A";
		var avgRatingJobProspects = facultyResponse.avgRatingJobProspects ? facultyResponse.avgRatingJobProspects.toFixed(1) : "N/A";
		var avgRatingStudentOrganisations = facultyResponse.avgRatingStudentOrganisations ? facultyResponse.avgRatingStudentOrganisations.toFixed(1) : "N/A";
		var avgRatingAccomodation = facultyResponse.avgRatingAccomodation ? facultyResponse.avgRatingAccomodation.toFixed(1) : "N/A";
		var avgRatingFacultyFacilities = facultyResponse.avgRatingFacultyFacilities ? facultyResponse.avgRatingFacultyFacilities.toFixed(1) : "N/A";
		<!-- var avgRatingStudentSupport = facultyResponse.avgRatingStudentSupport ? facultyResponse.avgRatingStudentSupport.toFixed(1) : "N/A"; -->
		var avgRatingTimeBalance = facultyResponse.avgRatingTimeBalance ? facultyResponse.avgRatingTimeBalance.toFixed(1) : "N/A";
		
		var savedFacultiesIds = getUField("usf");
		var favoriteClass;
		var favoriteTooltipText;
		var favoriteText;
		if (savedFacultiesIds && savedFacultiesIds.includes(facultyId)) {
			favoriteClass = "fas fa-heart fa-lg";
			favoriteTooltipText = "Elimină";
		} else {
			favoriteClass = "far fa-heart fa-lg";
			favoriteTooltipText = "Salvează";
		}
		
		var urlProfileRedirect = "./profile.html?id=";

		document.getElementById("faculty-name-row-content").innerHTML += (
	'									<div class="comparison-cell comparison-cell-faculty ' + collColumnWidth + '"> '
	+' 										<br> '
	+' 										<div class="row"> '
	+' 											<div class="col-xs-3">	 '
	+' 												<div data-toggle="tooltip" title="' + favoriteTooltipText + '" class="save" onclick="addToFavorites(this, &quot;'+facultyId+'&quot;, false)"> '
	+' 													<i class="' + favoriteClass + '"></i> '
	+' 												</div> '
	+' 											</div> '
	+' 											<div class="col-xs-3 col-xs-offset-6">	 '
	+' 												<div class="close"> '

	+' 												</div> '
	+' 											</div> '
	+' 										</div>	 '
	+' 										<div class="row"> '
	+' 											<div class="col-xs-4 col-xs-offset-4">															 '
	+' 												<a href="' + urlProfileRedirect + facultyId + '"> '
	+' 													<div class="img-faculty-logo-block-base img-faculty-logo-comparison-block">	'
	+' 														<img class="img-faculty-logo-base img-faculty-logo-comparison center-comparison" src= "' + facultyLogo + '"></img>												 '
	+' 													</div> '
	+'												</a>	'	
	+' 											</div> '
	+' 										</div>													 '
	+' 										<div class="row"> '
	+' 											<div class="col-xs-12"> '
	+' 												<a href="' + urlProfileRedirect + facultyId + '"><h5><strong>' + facultyName + '</strong></h5></a> '
	+' 											</div> '
	+' 										</div> '
	+' 									</div> ');

	+' 										<div class="center"> '

function getRecommendedFaculties(universityIds, comparedFacultyIds) {

	var backendUrl = new URL(backendUrlRoot + "/v1/faculty");
	
	if (!universityIds || universityIds.length == 0) {
		return;
	}

	backendUrl.searchParams.append("universityIds", universityIds.join());
	backendUrl.searchParams.append("ratingFrom", 0); // set to 1
	backendUrl.searchParams.append("limit", 12);
	
	  $.ajax({
	  url: backendUrl,
	  type: "GET",
	  beforeSend : function(request) {
			document.getElementById("recommended-carousel").innerHTML = '	<div class="text-center" style="height: 350px;">'
																					+'<div class="uil-reload-css reload-background" style=""><div></div></div>'
																				+'</div>';
			
		  },
	  success: function(response) {
		if (response.control.errorCode === 0) {
			loadRecommendedFacultiesContent(response, comparedFacultyIds);
		} else {
			console.log(response.control.errorDescription);
		}

	  },
	  error: function(error) {
		checkLoggedInUser(error.status);
	  }
	});
}

function loadRecommendedFacultiesContent(response, comparedFacultyIds) {

	var faculties = response.result.faculties;
	if (comparedFacultyIds) {
		faculties = faculties.filter(function(value, index, arr){
			return !comparedFacultyIds.includes(value.facultyId);
		});
	}
	
	if (faculties.length == 0 ) {
		document.getElementById("recommended-carousel").innerHTML = '<div class="text-center text-muted" style="height: 150px;"> <h4>Nu au fost găsite sugestii</h4> </div>';
		return;
	}

	var windowWidth = $(window).width();
	var colWidth;
	var recommendedNumberPerSlide;
	if (windowWidth > 1200) {
		colWidth = 'col-md-3';
		recommendedNumberPerSlide = 4;
	} else if (windowWidth > 992) {
		colWidth = 'col-md-4';
		recommendedNumberPerSlide = 3;
	} else if (windowWidth > 768) {
		colWidth = 'col-sm-6';
		recommendedNumberPerSlide = 2;
	} else {
		colWidth = 'col-xs-12';
		recommendedNumberPerSlide = 1;
	}
	
	var recommendedFacultiesString;
	
	var i;
	for (i in faculties) {
	
			if (i == 0) {
				recommendedFacultiesString = (
		'						<div class="item active">'
		+'							<div class="row">');
			}
			if (i!=0 && (i%recommendedNumberPerSlide)==0) {
				recommendedFacultiesString += (
		'						<div class="item">'
		+'							<div class="row">');
			}
			var faculty = faculties[i];
			var universityNameFront;
			var universityName = faculty.universityName;
			if (universityName.length > 50) {
				universityNameFront = universityName.substring(0, 50).concat('...');
			} else {
				universityNameFront = universityName;
			}
			var universityNameTooltipTitle = universityName.replaceAll("\"", "");
			
			var avgRating = faculty.avgRating;
			if (!avgRating) {
				avgRating = "N/A";
			} else {
				avgRating = avgRating.toFixed(1);
			}
			
			var logoSrc = backendUrlRoot + "/v1/faculty/" + faculty.facultyId + "/logo";	
			
			var urlProfileRedirect = "./profile.html?id=";
			
			recommendedFacultiesString += (
						'<div class="' + colWidth + '"><div class="card inner-card"> <div class="content" style="height: 350px;"> <div class="row"> <div class="col-xs-6 col-xs-offset-3"> <a href="' + urlProfileRedirect + faculty.facultyId + '"> <div class="img-faculty-logo-block-base img-faculty-logo-carousel-block"> <img id="logo" src="' + logoSrc + '" class="img-faculty-logo-base img-faculty-logo-carousel center"></img> </div> </a> </div> <div class="col-xs-12" style="margin-top: 15px; height: 170px;"> <a href="' + urlProfileRedirect + faculty.facultyId + '"> <h5><strong>' + faculty.facultyName + '</strong></h5> </a> <small data-toggle="tooltip" title="' + universityNameTooltipTitle + '">' + universityNameFront + '</small> <br> <small class="text-muted">' + faculty.facultyCity + '</small> <br> <a data-toggle="tooltip" title="Vezi evaluări" onclick="goToReviews(&quot;'+faculty.facultyId+'&quot;)"> <i class="fa fa-star rating-suggestion-card" style="color: orange"></i> <strong style="color: orange">' + avgRating + '</strong> </a> </div> <div class="col-xs-12 text-center" style="margin-top: 10px;"> <button class="btn btn-simple compare compare-carousel" onclick="addToCompareTable(this, &quot;'+faculty.facultyId+'&quot;)"><i class="fas fa-plus-circle fa-lg" style="margin-right: 7px; "></i><span data-i18n-key="compare">Compară</span> </button></div> </div> </div> </div> </div>');

		if (i==(faculties.length - 1) || i%recommendedNumberPerSlide==(recommendedNumberPerSlide-1)) {
			recommendedFacultiesString += ('</div> </div>');
		}
		
	}
	
	document.getElementById("recommended-carousel").innerHTML = recommendedFacultiesString;

	translatePage();
	
	$('#media').carousel('pause');
	
}

function addToCompareTable(button, facultyId) {

	if (typeof(Storage) !== "undefined") {
		var facultyIdsString = localStorage.getItem("fci");
		var facultyIds;
		if (facultyIdsString) {
			facultyIds = facultyIdsString.split(",");
		} else {
			facultyIds = [];
		}
		if (facultyIds.length <= 20 && !facultyIds.includes(facultyId)) {
			facultyIds.push(facultyId);
		}
		localStorage.setItem("fci", facultyIds);
	} else {
	  // Sorry! No Web Storage support..
	}
	
	document.body.scrollTop = 0; // For Safari
	document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
	getFaculties();
	

}

function removeFromCompare(facultyId) {

	if (typeof(Storage) !== "undefined") {
		var facultyIdsString = localStorage.getItem("fci");
		var facultyIds;
		if (facultyIdsString) {
			facultyIds = facultyIdsString.split(",");
		} else {
			facultyIds = [];
		}
		if (facultyIds.includes(facultyId)) {
			facultyIds = facultyIds.filter(function(value, index, arr){ return value !== facultyId;});
		}
		localStorage.setItem("fci", facultyIds);
		
		getFaculties();
		
	} else {
	  // Sorry! No Web Storage support..
	}
}
