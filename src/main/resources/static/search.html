<script>

const backendUrlRoot = "https://unistart.ro/Jamstudy";

<!-- $body = $("body"); -->
$(document).on({
    <!-- ajaxStart: function() { document.getElementById("load-more-faculties-main").innerHTML = '<div class="text-center"><div class="uil-reload-css reload-background" style=""><div></div></div></div>';  }, -->
    <!-- ajaxStop: function() { $body.removeClass("loading");  }     -->
});

var queryParams = new URLSearchParams(window.location.search);
var finalSearchInput;
var urlDomainInput = [];
var urlCityInput = [];
var domainParams = [];
var cityParams = [];
var currentlyVisibleFacultiesNo = 0;

window.addEventListener("resize", collapseExpand);
window.addEventListener("load", collapseExpand);


$(document).ready(function() {

	getPageHeader();
	getPageFooter();
	myAccountText();
	getLoginModal();
	getRegisterModal();
	getDomainsForSearchPage();
	getCitiesForSearchPage();
	finalSearchInput = queryParams.get("q");
	if(queryParams.get("d")) {
		urlDomainInput = queryParams.get("d").split(',');
	}
	if(queryParams.get("c")) {
		urlCityInput = queryParams.get("c").split(',');
	}
	<!-- queryParams.delete("q");
	<!-- queryParams.delete("d");
	<!-- queryParams.delete("c");
	<!-- history.replaceState(null, null, "?");
	
	if (finalSearchInput) {
		document.getElementById("search-input").value = finalSearchInput;
	}

	addDomainsCheckboxesEvent();
	addCitiesCheckboxesEvent();
	initializeCheckboxes();
	initiateAutocomplete();
	loadUser();
	loadData(false);	
	getRecentlyViewedFaculties();
});

window.onload = function() {
	translatePlaceholders();

  };

function translatePlaceholders() {
	var searchInputElement = document.getElementById("search-input");
	var translatedPlaceholder = translateKey("search-keywords-placeholder");
	searchInputElement.setAttribute("placeholder", translatedPlaceholder);
}

function initializeCheckboxes() {
	var i;
	for (i=0;i < urlDomainInput.length; i++) {
		var domainId = urlDomainInput[i];
		$("#" + domainId).prop('checked', true);
		$("label[for='" + domainId + "']").addClass("checked");
		domainParams.push(domainId);
	}
	var j;
	for (j=0;j < urlCityInput.length; j++) {
		var cityId = urlCityInput[j];
		$("#" + cityId).prop('checked', true);
		$("label[for='" + cityId + "']").addClass("checked");
		cityParams.push(cityId);
	}
}

function collapseExpand() {
	$('#search-filter').toggleClass('in', $(window).width() > 992);
}

function changeCaret() {
	$('#caret').toggleClass('caret-reversed');
}

function search() {
	var input = document.getElementById("search-input").value;
	queryParams.set("q", input);
	queryParams.set("d", "");
	queryParams.set("c", "");
	domainParams = [];
	cityParams = [];
	history.replaceState(null, null, "?" + queryParams.toString());
	finalSearchInput = input;
	clearCheckboxes();
    loadData(false);
}

document.getElementById("search-input").addEventListener("keyup", function(event) {
  // Number 13 is the "Enter" key on the keyboard
  if (event.keyCode === 13) {
    event.preventDefault();
    document.getElementById("search-button").click();
	$(this).blur();
  }
});

function searchByUniversityName(el) {
	var universityName = el.text;
	document.getElementById("search-input").value = universityName;
	search();
}

function clearCheckboxes() {
	$.each($("input:checked"), function(){
		$("label[for='" + $(this).attr("id") + "']").removeClass("checked");
	});
	$("input:checkbox").attr('checked', false);
}

function addDomainsCheckboxesEvent() {
	$.each($("input[name=domeniu]"), function() {
		$("label[for='" + $(this).attr("id") + "']").click(function() {

		var checkBoxElementId = $(this).attr("for");
		var checkBoxElement = $("input[id='" + checkBoxElementId + "']");

		if (checkBoxElement.prop("checked") === true) { //if it was already checked, it means now it is removed
			domainParams = domainParams.filter(function(value, index, arr){ return value !== checkBoxElement.attr("id");});
		} else { //if it was not checked, it means now it is checked
			domainParams.push($(this).attr("for"));
		}
		queryParams.set("d", domainParams);
		history.replaceState(null, null, "?" + queryParams.toString());

		loadData(false);
		});
	});
}

function addCitiesCheckboxesEvent() {
	$.each($("input[name=oras]"), function() {
		$("label[for='" + $(this).attr("id") + "']").click(function() {

		var checkBoxElementId = $(this).attr("for");
		var checkBoxElement = $("input[id='" + checkBoxElementId + "']");

		if (checkBoxElement.prop("checked") === true) { //if it was already checked, it means now it is removed
			cityParams = cityParams.filter(function(value, index, arr){ return value !== checkBoxElement.attr("id");});
		} else {
			cityParams.push($(this).attr("for"));
		}
		queryParams.set("c", cityParams);
		history.replaceState(null, null, "?" + queryParams.toString());
		loadData(false);
		});
	});
}


function loadData(loadMore) {

		<!-- var numberOfResultsPerPage = document.getElementById("results-on-page").value;	 -->
		var numberOfResultsPerPage = 10;
		var sortingOrder = document.getElementById("sorting").value;
		
		var offset;
		if (loadMore) {
			offset = currentlyVisibleFacultiesNo;
		} else {
			offset = 0;
		}
		
		var dCounter;
		var domainNames = [];
		for (dCounter = 0;dCounter < domainParams.length; dCounter++) {
			domainNames.push(document.getElementById(domainParams[dCounter]).value);
		}
		
		var cCounter;
		var cityNames = [];
		for (cCounter = 0;cCounter < cityParams.length; cCounter++) {
			cityNames.push(document.getElementById(cityParams[cCounter]).value);
		}
		
		if (!loadMore && typeof gtag === 'function') {
			gtag('event', 'search_faculties', {
				'search_keyword': finalSearchInput,
				'search_domains': domainNames,
				'search_cities': cityNames,
				'sorting_order': sortingOrder
			});
		}
		
		var backendUrl = new URL(backendUrlRoot + "/v1/faculty");
		
		if (offset) {
			backendUrl.searchParams.append("offset", offset);
		}
		if (numberOfResultsPerPage) {
			backendUrl.searchParams.append("limit", numberOfResultsPerPage);
		}
		if (sortingOrder) {
			backendUrl.searchParams.append("orderBy", sortingOrder);
		}
		if (finalSearchInput) {
			 backendUrl.searchParams.append("searchBy", finalSearchInput);
		}
		if (domainNames.length !== 0) {
			backendUrl.searchParams.append("facultyDomains", domainNames);
			<!-- for(var d = 0;d < domainNames.length; d++) { -->
				<!-- backendUrl.searchParams.append("facultyDomains", domainNames[d]); -->
			<!-- } -->
		}
		if (cityNames.length !== 0) {
			//backendUrl.searchParams.append("facultyCities", cityNames.join(','));
			for(var c = 0;c < cityNames.length; c++) {
				backendUrl.searchParams.append("facultyCities", cityNames[c]);
			}
		}

	      $.ajax({
          url: backendUrl,
          type: "GET",
		  beforeSend : function(request) {
			if (!loadMore) {
				document.getElementById("faculty-entries").innerHTML = '	<div class="text-center">'
																					+'<div class="uil-reload-css reload-background" style=""><div></div></div>'
																				+'</div>';
				document.getElementById("load-more-faculties-main").innerHTML = '';
			} else {
				document.getElementById("load-more-faculties-main").innerHTML = '<div class="text-center"><div class="uil-reload-css reload-background" style=""><div></div></div></div>';
			}
		  },
          success: function(response) {
			
			if (loadMore) {
				currentlyVisibleFacultiesNo += response.result.faculties.length;
			} else {
				document.getElementById("faculty-entries").innerHTML = '';
				currentlyVisibleFacultiesNo = response.result.faculties.length;
			}
			
			if  (currentlyVisibleFacultiesNo >= response.result.count) {
				document.getElementById("load-more-faculties-main").innerHTML = '';
			} else {
				document.getElementById("load-more-faculties-main").innerHTML = '<div class="card">'
																				+ '<div class="content"> '
																					+ '<div class="text-center row"> '
																						+ '<button id="load-more-faculties" class="btn btn-info btn-fill" type="submit" onclick="loadMore()" data-i18n-key="load-more">Încarcă mai multe rezultate</button>'
																					+ '</div> '
																				+ '</div> '
																			+ '</div>';
			}
			
			if (response.result.faculties.length == 0) {
				document.getElementById("faculty-entries").innerHTML = '<div class="text-center text-muted"> <h4>Nu au fost găsite rezultate</h4> </div>';
				return;
			}
			
			var urlProfileRedirect = "./profile.html?id=";
			
			var i;
			for (i in response.result.faculties) {
			
				var avgRating = response.result.faculties[i].avgRating;
				if (!avgRating) {
					avgRating = "N/A";
				} else {
					avgRating = avgRating.toFixed(1);
				}
				
				var countRev = response.result.faculties[i].countRev;
				var countRevText;
				if (!countRev) {
					countRevText = "";
				} else if (countRev === 1) {
					countRevText = "<span data-i18n-key='from'>din</span> 1 <span data-i18n-key='review-v2'>evaluare</span>";
				} else {
					countRevText = "<span data-i18n-key='from'>din</span> " + countRev + " <span data-i18n-key='reviews-v2'>evaluări</span>";
				}
				
				var facultyId = response.result.faculties[i].facultyId;
				var facultyName = escapeHtml(response.result.faculties[i].facultyName);
				var universityName = escapeHtml(response.result.faculties[i].universityName);
				var facultyCity = escapeHtml(response.result.faculties[i].facultyCity);
				
				var universityNameForLogo = universityName.replaceAll("\"", "_");
				var logoName = facultyName + universityNameForLogo;
				<!-- var logoSrc = "C://logos_jamstudy/" + logoName + ".png"; -->
				var logoSrc = backendUrlRoot + "/v1/faculty/" + response.result.faculties[i].facultyId + "/logo";	
				<!-- var defaultErrorImg = "'C://logos_jamstudy/default_image.png'"; -->
				
				var savedFacultiesIds = getUField("usf");
				var favoriteClass;
				var favoriteText;
				if (savedFacultiesIds && savedFacultiesIds.includes(facultyId)) {
					favoriteClass = "fas fa-heart fa-lg";
					favoriteText = "<span data-i18n-key='saved'>Salvată</span>";
				} else {
					favoriteClass = "far fa-heart fa-lg";
					favoriteText = "<span data-i18n-key='save'>Salvează</span>";
				}
	
				document.getElementById("faculty-entries").innerHTML += ('<div class="card"> <div class="content"> <div class="row"> <div class="col-md-2 col-md-offset-0 col-sm-4 col-sm-offset-4 col-xs-4 col-xs-offset-4">  <a href="' + urlProfileRedirect + facultyId + '"> <div class="img-faculty-logo-block-base img-faculty-search-logo-block"> <img id="logo" src="' + logoSrc + '" class="img-faculty-logo-base img-faculty-logo-search center-logo-search"></img> </div> </a> </div> <div class="col-xs-12 col-md-6" style="display:inline; vertical-align: middle;"> <a href="' + urlProfileRedirect + facultyId + '"> <h5><strong>' + facultyName + '</strong></h5> </a> <a data-toggle="tooltip" title="Filtrează după universitate" onclick="searchByUniversityName(this)"><h6><strong>' + universityName + '</strong></h6></a> <small class="text-muted">' + facultyCity + '</small> <br> <a data-toggle="tooltip" title="Vezi evaluări" onclick="goToReviews(&quot;'+facultyId+'&quot;)"> <i class="fa fa-star" style="color: orange"></i> <strong style="color: orange">' + avgRating + '</strong> <strong>' + countRevText + '</strong> </a> </div> <div class="col-xs-12 col-xs-offset-0 col-md-4" style="margin-top:10px;"> <a data-toggle="tooltip" title="Adaugă evaluare 100% anonim" class="btn btn-warning btn-fill btn-block add-review-button" onclick="goToAddReview(this, &quot;'+facultyId+'&quot;)"><i class="fas fa-pen fa-lg" style="color: white; margin-right: 7px;"></i> <span data-i18n-key="add-review">Adaugă evaluare</span></a> <div class="row save-compare-search-list"> <div class="col-xs-6"> <button class="btn-danger btn btn-simple save" onclick="addToFavorites(this, &quot;'+facultyId+'&quot;, true)"><i class="' + favoriteClass + '" style="margin-right: 7px"></i>' + favoriteText + '</button> </div> <div class="col-xs-6 text-right" > <button class="btn btn-simple compare" onclick="addToCompare(this, &quot;'+facultyId+'&quot;, true)"><i class="fas fa-plus-circle fa-lg" style="margin-right: 7px; "></i><span data-i18n-key="compare">Compară</span> </button></div> </div> </div> </div> </div> </div>');

				translatePage();
			}
          },
          error: function(error) {
			checkLoggedInUser(error.status);
          }
        });
}

function loadMore() {
	loadData(true);
}

function getRecentlyViewedFaculties() {

	if (typeof(Storage) == "undefined") {
		return;
	}

	var facultyIdsString = localStorage.getItem("rvi");
	var facultyIds;
	if (facultyIdsString) {
		facultyIds = facultyIdsString.split(",");
	}
	if (!facultyIds || facultyIds.length === 0) {
		document.getElementById("recently-viewed-faculties").innerHTML = '';
		document.getElementById("recent-faculties-section").style.padding = '0px';
		return;
	}

	var limit = 16;
	var backendUrl = new URL(backendUrlRoot + "/v1/faculty");
	backendUrl.searchParams.append("facultyIds", facultyIds.join());
	backendUrl.searchParams.append("limit", limit);
	
	  $.ajax({
	  url: backendUrl,
	  type: "GET",
	  beforeSend : function(request) {
			document.getElementById("recently-viewed-faculties").innerHTML = '	<div class="text-center" style="height: 350px;">'
																					+'<div class="uil-reload-css reload-background" style=""><div></div></div>'
																				+'</div>';
			
		  },
	  success: function(response) {
		if (response.control.errorCode === 0) {
			var facultyIdsCopy = facultyIds.slice();
			var sortedResponse = response.result.faculties.map(function(item) {
				var n = facultyIdsCopy.indexOf(item.facultyId);
				facultyIdsCopy[n] = '';
				return [n, item]
			}).sort(function (a, b) { return a[0] - b[0];  }).map(function(j) { return j[1] });
			sortedResponse = sortedResponse.reverse();
			loadRecentlyViewedFacultiesContent(sortedResponse);
		} else {
			console.log(response.control.errorDescription);
		}

	  },
	  error: function(error) {
		checkLoggedInUser(error.status);
	  }
	});
}

function loadRecentlyViewedFacultiesContent(sortedResponse) {

	var faculties = sortedResponse;
	
	if (faculties.length == 0 ) {
		document.getElementById("recently-viewed-faculties").innerHTML = '';
		document.getElementById("recent-faculties-section").style.padding = '0px';
		return;
	}
	
	
	var recentFacultiesString = 
'						<div class="row">'
+'							<div class="col-xs-12">'
+'								<h4 class="title">Recent vizualizate</h4>         '           
+'							</div>'
+'						</div>';

	var windowWidth = $(window).width();
	var colWidth;
	var recentFacultiesPerSlide;
	if (windowWidth > 1200) {
		colWidth = 'col-md-3';
		recentFacultiesPerSlide = 4;
	} else if (windowWidth > 992) {
		colWidth = 'col-md-4';
		recentFacultiesPerSlide = 3;
	} else if (windowWidth > 768) {
		colWidth = 'col-sm-6';
		recentFacultiesPerSlide = 2;
	} else {
		colWidth = 'col-xs-12';
		recentFacultiesPerSlide = 1;
	}
	
	recentFacultiesString += 
'						<div class="row">'
+'							<div class="col-md-12">'
+'							  <div class="carousel slide media-carousel" id="media">'
+'								<div id="recent-faculties-carousel" class="carousel-inner">';
	
	var i;
	for (i in faculties) {
	
			if (i == 0) {
				recentFacultiesString += (
		'						<div class="item active">'
		+'							<div class="row">');
			}
			if (i!=0 && (i%recentFacultiesPerSlide)==0) {
				recentFacultiesString += (
		'						<div class="item">'
		+'							<div class="row">');
			}
			var faculty = faculties[i];
			var universityNameFront;
			var universityName = escapeHtml(faculty.universityName);
			if (universityName.length > 50) {
				universityNameFront = universityName.substring(0, 50).concat('...');
			} else {
				universityNameFront = universityName;
			}
			var universityNameTooltipTitle = universityName.replaceAll("\"", "");
			
			var avgRating = faculties[i].avgRating;
			if (!avgRating) {
				avgRating = "N/A";
			} else {
				avgRating = avgRating.toFixed(1);
			}
			
			var logoSrc = backendUrlRoot + "/v1/faculty/" + faculties[i].facultyId + "/logo";	
			
			var urlProfileRedirect = "./profile.html?id=";
			
			recentFacultiesString += (
						'<div class="' + colWidth + '"><div class="card inner-card"> <div class="content"> <div class="row"> <div class="col-xs-6 col-xs-offset-3"> <a href="' + urlProfileRedirect + faculty.facultyId + '"> <div class="img-faculty-logo-block-base img-faculty-logo-carousel-block"> <img id="logo" src="' + logoSrc + '" class="img-faculty-logo-base img-faculty-logo-carousel center"></img> </div> </a> </div> <div class="col-xs-12" style="margin-top: 15px; height: 170px;"> <a href="' + urlProfileRedirect + faculty.facultyId + '"> <h5><strong>' + escapeHtml(faculty.facultyName) + '</strong></h5> </a> <small data-toggle="tooltip" title="' + universityNameTooltipTitle + '">' + universityNameFront + '</small> <br> <small class="text-muted">' + escapeHtml(faculty.facultyCity) + '</small> <br> <a data-toggle="tooltip" title="Vezi evaluări" onclick="goToReviews(&quot;'+faculty.facultyId+'&quot;)"> <i class="fa fa-star rating-suggestion-card" style="color: orange"></i> <strong style="color: orange">' + avgRating + '</strong> </a> </div>  </div> </div> </div> </div>');

		if (i==(faculties.length - 1) || i%recentFacultiesPerSlide==(recentFacultiesPerSlide-1)) {
			recentFacultiesString += ('</div> </div>');
		}
		
	}
	
	recentFacultiesString += 
'								</div>'
+'								<a data-slide="prev" href="#media" class="left carousel-control">‹</a>'
+'								<a data-slide="next" href="#media" class="right carousel-control">›</a>'
+'							  </div>    '                      
+'							</div>'
+'						</div>';
	
	document.getElementById("recently-viewed-faculties").innerHTML = recentFacultiesString;
	
	$('#media').carousel('pause');
	
}

</script>
