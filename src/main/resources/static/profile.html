<script>

    const backendUrlRoot = "https://unistart.ro/Jamstudy";

    var reviewTop = [];

    $wrapper = $("#wrapper");
    $(document).on({
        <!-- ajaxStart: function() { $wrapper.addClass("loading");    }, -->
        ajaxStop: function() {
            translatePage();
            $wrapper.removeClass("loading");
            document.getElementById("main-loading").style.display = "none";
        }
    });


    var facultyId;
    var currentlyVisibleReviewsNo = 0;
    var currentlyVisibleQuestionsNo = 0;
    var facultyDescription;
    var ANSWERS_PAGE_SIZE = 3;

    $(document).ready(function() {

        getPageHeader();
        getPageFooter();
        myAccountText();
        getLoginModal();
        getRegisterModal();
        var queryParams = new URLSearchParams(window.location.search);
        facultyId = queryParams.get("id");
        loadUser();
        getFaculty();
        getReviews(false);
        getQA(false);
        addToRecentlyViewed();
        increaseViewCount();

    });

    function addHash(obj) {
        var hash = obj.href.split("#")[1];
        history.replaceState(null, null, "#" + hash);
        <!-- location.hash = hash; -->
        translatePage();
    }

    function updateDonutChart (el, percent, donut) {
        var percentText = percent;
        if (percent === "N/A") {
            percent = 0;
            percentText = "N/A";
            $(el + ' .smaller').text("");
        }
        percent = Math.round(percent);
        if (percent > 100) {
            percent = 100;
        } else if (percent < 0) {
            percent = 0;
        }
        var deg = Math.round(360 * (percent / 100));

        if (percent > 50) {
            $(el + ' .pie').css('clip', 'rect(auto, auto, auto, auto)');
            $(el + ' .right-side').css('transform', 'rotate(180deg)');
        } else {
            $(el + ' .pie').css('clip', 'rect(0, 1em, 1em, 0.5em)');
            $(el + ' .right-side').css('transform', 'rotate(0deg)');
        }
        if (donut) {
            $(el + ' .right-side').css('border-width', '0.1em');
            $(el + ' .left-side').css('border-width', '0.1em');
            $(el + ' .shadow').css('border-width', '0.1em');
        } else {
            $(el + ' .right-side').css('border-width', '0.5em');
            $(el + ' .left-side').css('border-width', '0.5em');
            $(el + ' .shadow').css('border-width', '0.5em');
        }
        $(el + ' .num').text(percentText);
        $(el + ' .left-side').css('transform', 'rotate(' + deg + 'deg)');
    }

    function viewMore(i) {
      var moreText = document.getElementById("view-more-text-" + i);
      var btnText = document.getElementById("view-more-button-" + i);

      if (moreText.style.display === "none") {
            btnText.innerHTML = "- Vezi mai putin";
            moreText.style.display = "inline";
            btnText.setAttribute("data-i18n-key", "see-less");
      } else {
            btnText.innerHTML = "+ Vezi tot";
            moreText.style.display = "none";
            btnText.setAttribute("data-i18n-key", "see-all");
      }

      translateElement(btnText);
    }

    function getFaculty() {

            var backendUrl = new URL(backendUrlRoot + "/v1/faculty/" + facultyId);

              $.ajax({
              url: backendUrl,
              type: "GET",
              success: function(response) {

                if (response.control.errorCode === 0) {
                    loadProfileHeader(response);
                    loadProfileTab(response);
                    loadFacultyProgramsTab(response);
                    getCompanies(response.result.companyIds);
                    getOtherFacultiesFromSameUniversity(response.result.universityId);

                } else {
                    console.log(response.control.errorDescription);
                }

              },
              error: function(error) {
                if (checkLoggedInUser(error.status)) {
                    location.href = "./error.html";
                }
              }
            });
    }

    function getReviews(loadMore) {

        <!-- var numberOfResultsPerPage = document.getElementById("reviews-results-on-page").value; -->
        var numberOfResultsPerPage = 10;
        var sortingOrder = document.getElementById("reviews-sorting").value;
        var searchKeyword = document.getElementById("search-review-keyword").value;

        var offset;
        if (loadMore) {
            offset = currentlyVisibleReviewsNo;
        } else {
            offset = 0;
        }

        var backendUrlReviews = new URL(backendUrlRoot + "/v1/review/faculty/" + facultyId);

        if (offset) {
            backendUrlReviews.searchParams.append("offset", offset);
        }
        if (numberOfResultsPerPage) {
            backendUrlReviews.searchParams.append("limit", numberOfResultsPerPage);
        }
        if (sortingOrder) {
            backendUrlReviews.searchParams.append("orderBy", sortingOrder);
        }
        if (searchKeyword) {
            backendUrlReviews.searchParams.append("searchBy", searchKeyword);
        }

        $.ajax({
          url: backendUrlReviews,
          type: "GET",
           beforeSend : function(request) {
            if (!loadMore) {
                document.getElementById("faculty-profile-review-entries").innerHTML = '	<div class="text-center">'
                                                                                        +'<div class="uil-reload-css reload-background" style=""><div></div></div>'
                                                                                    +'</div>';
                document.getElementById("load-more-reviews-main").innerHTML = '';
            } else {
                document.getElementById("load-more-reviews-main").innerHTML = '<div class="text-center"><div class="uil-reload-css reload-background" style=""><div></div></div></div>';
            }
          },
          success: function(response) {

            loadReviewsTab(response, loadMore);

          },
          error: function(error) {
            checkLoggedInUser(error.status)
          }
        });
    }

    function loadMore() {
        getReviews(true);
    }

    function getQA(loadMore) {

        var numberOfResultsPerPage = 10;
        var sortingOrder = document.getElementById("questions-sorting").value;
        var searchKeyword = document.getElementById("search-question-keyword").value;

        var offset;
        if (loadMore) {
            offset = currentlyVisibleQuestionsNo;
        } else {
            offset = 0;
        }

        var backendUrlQuestions = new URL(backendUrlRoot + "/v1/question/faculty/" + facultyId);

        if (offset) {
            backendUrlQuestions.searchParams.append("offset", offset);
        }
        if (numberOfResultsPerPage) {
            backendUrlQuestions.searchParams.append("limit", numberOfResultsPerPage);
        }
        if (sortingOrder) {
            backendUrlQuestions.searchParams.append("orderBy", sortingOrder);
        }
        if (searchKeyword) {
            backendUrlQuestions.searchParams.append("searchBy", searchKeyword);
        }

        $.ajax({
          url: backendUrlQuestions,
          type: "GET",
           beforeSend : function(request) {
            if (!loadMore) {
                document.getElementById("faculty-profile-questions-entries").innerHTML = '	<div class="text-center">'
                                                                                        +'<div class="uil-reload-css reload-background" style=""><div></div></div>'
                                                                                    +'</div>';
                document.getElementById("load-more-questions-main").innerHTML = '';
            } else {
                document.getElementById("load-more-questions-main").innerHTML = '<div class="text-center"><div class="uil-reload-css reload-background" style=""><div></div></div></div>';
            }
          },
          success: function(response) {

            loadQATab(response, loadMore);

          },
          error: function(error) {
            checkLoggedInUser(error.status)
          }
        });
    }

    function loadMoreQA() {
        getQA(true);
    }

    function loadProfileHeader(response) {
                var coverImage = document.getElementById("faculty-cover-image");
                coverImage.src = new URL(backendUrlRoot + "/v1/faculty/" + facultyId + "/cover");

                var facultyName = response.result.facultyName;

                if (typeof gtag === 'function') {
                    gtag('event', 'faculty_profile', {
                      'faculty_id': facultyId,

    function submitAnswer(i, questionId) {
        var answerText = document.getElementById("answer-text-" + i).value;

        var backendUrl = new URL(backendUrlRoot + "/v1/question/" + questionId + "/answer");

        var data = {
            "answerText": answerText
        };

        $.ajax({
            url: backendUrl,
            type: "POST",
            dataType: 'json',
            contentType: 'application/json',
            crossDomain: true,
            data: JSON.stringify(data),
            success: function(response) {
                getQA(false);
            },
            error: function(error) {
                if (checkLoggedInUser(error.status)) {
                    $("#general-modal").modal();
                    document.getElementById('modal-header-text').innerHTML = '<i class="fas fa-exclamation-triangle fa-3x"></i>';
                    var errorDescription = (error.responseJSON && error.responseJSON.control) ? error.responseJSON.control.errorDescription : "Răspunsul nu a putut fi adăugat";
                    document.getElementById('modal-text').innerHTML = errorDescription;
                }
            }
        });
    }

    function upvoteQuestion(el, questionId) {
        var jwtToken = getUField("ut");
        if (!jwtToken) {
            el.setAttribute("data-toggle", 'modal');
            el.setAttribute("data-target", '#login-modal');
            return false;
        }

        var regularIcon = "far";
        var solidIcon = "fas";

        var upvote = $(el).hasClass(regularIcon);
        var upvotesValue = parseInt(el.nextSibling.innerHTML);

        var backendUrl = new URL(backendUrlRoot + "/v1/question/" + questionId + "/upvote");

        $(el).addClass("fa-disabled");

        $.ajax({
            url: backendUrl,
            type: 'PUT',
            dataType: 'json',
            contentType: 'application/json',
            crossDomain: true,
            data: JSON.stringify({ upvote: upvote }),
            success: function (data) {
                var upvotedQuestionsIds = getUField("ulq") || [];
                if (upvote) {
                    $(el).removeClass(regularIcon).addClass(solidIcon);
                    el.nextSibling.innerHTML = (upvotesValue + 1);
                    upvotedQuestionsIds.push(questionId);
                } else {
                    $(el).removeClass(solidIcon).addClass(regularIcon);
                    el.nextSibling.innerHTML = (upvotesValue - 1);
                    upvotedQuestionsIds = upvotedQuestionsIds.filter(function(value) { return questionId != value; });
                }
                setUField("ulq", upvotedQuestionsIds);
            },
            error: function(error) {
                if (checkLoggedInUser(error.status)) {
                    $("#general-modal").modal();
                    document.getElementById('modal-header-text').innerHTML = '<i class="fas fa-exclamation-triangle fa-3x"></i>';
                    document.getElementById('modal-text').innerHTML = "Întrebarea nu a putut fi votată";
                }
            },
            complete: function(data) {
                $(el).removeClass("fa-disabled");
            }
        });
    }

    function loadMap(address, city) {
        const currentUrl = window.location.href;
        var zoom = 14;

        if (!address) {
            if (!city) {
                address = currentUrl.includes("unistart.lt") ? 'Lithuania' : 'Romania';
            } else {
                address = city;
            }
            zoom = 7;
        }

        if (address.includes('nr.')) {
            address = address.replace('nr.', '');
        } else if (address.includes('Nr.')) {
            address = address.replace('Nr.', '');
        } else if (address.includes('nr')) {
            address = address.replace('nr', '');
        }

        if (city) {
            var city0 = city.split(",")[0].trim();
            if (!normalizeRomanianDiacritics(address).includes(normalizeRomanianDiacritics(city0))) {
                address = address + ', ' + city;
            }
        }

        geocodeAddress(address, zoom, city);
    }

    // Romanian ș/ț are sometimes stored with the legacy cedilla forms (ş/ţ)
    // instead of the correct comma-below forms (ș/ț) — same rendered look,
    // different codepoints, so a plain .includes() check misses the match.
    function normalizeRomanianDiacritics(text) {
        return text
            .replace(/ş/g, 'ș') // ş -> ș
            .replace(/Ş/g, 'Ș') // Ş -> Ș
            .replace(/ţ/g, 'ț') // ţ -> ț
            .replace(/Ţ/g, 'Ț'); // Ţ -> Ț
    }

    function geocodeAddress(address, zoom, city) {
        var searchParams = new URLSearchParams({
        "format": "json",
        "addressdetails": 1,
        "q": address,
        "limit": 1
        });

        delete $.ajaxSettings.headers["Token"]; // workaround
        $.ajax({
          method: "GET",
          url: "https://nominatim.openstreetmap.org/search?" + searchParams.toString(),
          beforeSend : function(request) {
          }
        })
        .success(function(response) {
            if ((!response || response.length === 0) && city && address !== city) {
                // Address is too specific for Nominatim to geocode (e.g. includes
                // a building/wing name); fall back to the city so the map still
                // centers somewhere meaningful instead of the whole country.
                geocodeAddress(city, 12, city);
            } else {
                createMap(response, zoom);
            }
        })
        .error(function(error) {
            console.log(error);
        })
        $.ajaxSettings.headers["Token"] = getUField("ut") ? "Bearer " + getUField("ut") : null; // workaround

    }

    function createMap(response, zoom) {
            const currentUrl = window.location.href;
            var longitude;
            var latitude;
            if (!response || response.length == 0) {
                if (currentUrl.includes("unistart.lt")) {
                    longitude = 24.000;
                    latitude = 55.000;
                } else {
                    longitude = 24.697;
                    latitude = 45.905;
                }
                zoom = 7;
            } else {
                // Nominatim returns lon/lat as strings; OpenLayers' extent/tile-range
                // math needs real numbers or it silently computes an empty tile range.
                longitude = parseFloat(response[0].lon);
                latitude = parseFloat(response[0].lat);
            }
            <!-- const mapUrl = 'https://{a-c}.tile.openstreetmap.org/{z}/{x}/{y}.png'; -->
            const mapUrl = 'https://{a-c}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png';
            var map = new ol.Map({
                target: 'map',
                layers: [
                  new ol.layer.Tile({
                    source: new ol.source.OSM({"url" : mapUrl})
                  })
                ],
                view: new ol.View({
                  center: ol.proj.fromLonLat([longitude, latitude]),
                  zoom: zoom
                })
              });


            var features = [];
            var iconFeature = new ol.Feature({
                geometry: new ol.geom.Point(ol.proj.transform([longitude, latitude], 'EPSG:4326', 'EPSG:3857'))
            });

            var iconStyle = new ol.style.Style({
                image: new ol.style.Icon(({
                    anchor: [1, 1],
                    src: "./assets/img/map_marker.png"
                }))
            });

            iconFeature.setStyle(iconStyle);
            features.push(iconFeature);

            var vectorSource = new ol.source.Vector({
                features: features
            });

            var vectorLayer = new ol.layer.Vector({
                source: vectorSource
            });
            map.addLayer(vectorLayer);

            // OL 6.5 has no built-in resize observer: if the container's layout
            // wasn't settled yet on the first render pass, the map is left blank
            // (controls render, but the tile/vector layers never paint) until the
            // size is recomputed explicitly.
            setTimeout(function() {
                map.updateSize();
            }, 200);

            if ($(window).width() > 992) {
                const olViewport = document.getElementsByClassName('ol-viewport').length > 0 ? document.getElementsByClassName('ol-viewport')[0] : null;
                if (olViewport) {
                    olViewport.style.borderRadius = '20px';
                    olViewport.style.border = '2px solid black';
                }
            }
    }
