	<script>
		/* Absolute per-domain canonical - see the comment in webapp/index.html.
		   Served on unistart.ro and unistart.lt (+ www variants), so a relative
		   canonical points each host at itself. Mirrors RequestUtils.canonicalHost(). */
		(function () {
			var h = (location.hostname || '').toLowerCase(), c, www = h.lastIndexOf('www.', 0) === 0;
			if (h.indexOf('unistart.lt') !== -1) c = www ? h : 'www.' + h;
			else if (h.indexOf('unistart.ro') !== -1) c = www ? h.slice(4) : h;
			else return;
			var l = document.querySelector('link[rel="canonical"]');
			if (!l) { l = document.createElement('link'); l.rel = 'canonical'; document.head.appendChild(l); }
			l.href = 'https://' + c + location.pathname.replace(/\/index\.html$/, '/');
		})();
	</script>

<script type="text/javascript">


const backendUrlRoot = "https://unistart.ro/Jamstudy";

$().ready(function(){    
	<!-- demo.initContactUsMap(); -->
	getPageHeader();
	getPageFooter();
	myAccountText();
	getLoginModal();
	getRegisterModal();

});

window.onload = function() {
	translatePlaceholders();

  };

function translatePlaceholders() {
	var feedbackNameElement = document.getElementById("feedback-name");
	var translatedPlaceholderName = translateKey("contact-name");
	feedbackNameElement.setAttribute("placeholder", translatedPlaceholderName);
	var feedbackMessageElement = document.getElementById("feedback-message");
	var translatedPlaceholderMessage = translateKey("leave-feedback");
	feedbackMessageElement.setAttribute("placeholder", translatedPlaceholderMessage);
}

// Leave feedback
document.getElementById("send-feedback-btn").onclick = function (e) {
	e.preventDefault();
	
	var name = document.getElementById("feedback-name").value.trim();
	var email = document.getElementById("feedback-email").value.trim();
	var message = document.getElementById("feedback-message").value.trim();
	if (!validateEmail(email)) {
		document.getElementById('feedback-header-text').innerHTML = '<i class="fas fa-exclamation-triangle fa-2x"></i>';
		document.getElementById('feedback-modal-text').innerHTML = "Adresa de email nu este validă";
	} else {
	var body = {
		name: name,
		email: email,
		message: message
	};
		
	var backendUrl = new URL(backendUrlRoot + "/v1/feedback/add");
	
	$.ajax({
		url: backendUrl,
		type: 'PUT',
		dataType: 'json',
		contentType: 'application/json',
		crossDomain: true,
		data: JSON.stringify(body),
		success: function (data) {
			document.getElementById('feedback-modal-text').innerHTML = "Mesajul a fost trimis";
		},
		error: function(error) {
			document.getElementById('feedback-header-text').innerHTML = '<i class="fas fa-exclamation-triangle fa-2x"></i>';
			if (error.responseJSON) {
				if (error.responseJSON.control) {
					var errorDescription = error.responseJSON.control.errorDescription;
					document.getElementById('feedback-modal-text').innerHTML = errorDescription;
				} else {
					document.getElementById('feedback-modal-text').innerHTML = "Mesajul nu a putut fi trimis";
				}
			} else {
				document.getElementById('feedback-modal-text').innerHTML = "Mesajul nu a putut fi trimis";
			}
		}
	});
	
	}
}

function validateEmail(email) {
    const re = /^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$/;
    return re.test(String(email).toLowerCase());
}
