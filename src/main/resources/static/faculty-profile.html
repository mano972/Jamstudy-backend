<script>

const backendUrlRoot = "https://unistart.ro/Jamstudy";

$body = $("body");
$(document).on({
    ajaxStart: function() { $body.addClass("loading");    },
    ajaxStop: function() { $body.removeClass("loading"); }    
});


var facultyId;
var currentlyVisibleReviewsNo = 0;

$(document).ready(function() {

	var queryParams = new URLSearchParams(window.location.search);
	facultyId = queryParams.get("id");
	getFaculty();
	getReviews(false);
  
});

function addHash(obj) {
	var hash = obj.href.split("#")[1];
	history.replaceState(null, null, "#" + hash);
	<!-- location.hash = hash; -->
}

function updateDonutChart (el, percent, donut) {
	var percentText = percent;
	if (percent === "N/A") {
		percent = 0;
		percentText = "N/A";
		$(el + ' .smaller').text("");
	}
    percent = Math.round(percent);
    if (percent > 100) {
        percent = 100;
    } else if (percent < 0) {
        percent = 0;
    }
    var deg = Math.round(360 * (percent / 100));

    if (percent > 50) {
        $(el + ' .pie').css('clip', 'rect(auto, auto, auto, auto)');
        $(el + ' .right-side').css('transform', 'rotate(180deg)');
    } else {
        $(el + ' .pie').css('clip', 'rect(0, 1em, 1em, 0.5em)');
        $(el + ' .right-side').css('transform', 'rotate(0deg)');
    }
    if (donut) {
        $(el + ' .right-side').css('border-width', '0.1em');
        $(el + ' .left-side').css('border-width', '0.1em');
        $(el + ' .shadow').css('border-width', '0.1em');
    } else {
        $(el + ' .right-side').css('border-width', '0.5em');
        $(el + ' .left-side').css('border-width', '0.5em');
        $(el + ' .shadow').css('border-width', '0.5em');
    }
    $(el + ' .num').text(percentText);
    $(el + ' .left-side').css('transform', 'rotate(' + deg + 'deg)');
}

function viewMore(i) {
  var moreText = document.getElementById("view-more-text-" + i);
  var btnText = document.getElementById("view-more-button-" + i);
  
  if (moreText.style.display === "none") {
		btnText.innerHTML = "- Vezi mai putin";
		moreText.style.display = "inline";
  } else {
		btnText.innerHTML = "+ Vezi tot";
		moreText.style.display = "none";
  }
} 

function getFaculty() {

		var backendUrl = new URL(backendUrlRoot + "/v1/faculty/" + facultyId);

	      $.ajax({
          url: backendUrl,
          type: "GET",
          success: function(response) {
			
			if (response.control.errorCode === 0) {
				loadProfileHeader(response);
				loadProfileTab(response);
			} else {
				console.log(response.control.errorDescription);
			}

          },
          error: function(error) {
            console.log(error);
          }
        });
}

function getReviews(loadMore) {
	
	<!-- var numberOfResultsPerPage = document.getElementById("reviews-results-on-page").value; -->
	var numberOfResultsPerPage = 10;	
	var sortingOrder = document.getElementById("reviews-sorting").value;
	var searchKeyword = document.getElementById("search-review-keyword").value;
	
	var offset;
	if (loadMore) {
		offset = currentlyVisibleReviewsNo;
	} else {
		offset = 0;
	}
	
	var backendUrlReviews = new URL(backendUrlRoot + "/v1/review/faculty/" + facultyId);
	
	if (offset) {
		backendUrlReviews.searchParams.append("offset", offset);
	}
	if (numberOfResultsPerPage) {
		backendUrlReviews.searchParams.append("limit", numberOfResultsPerPage);
	}
	if (sortingOrder) {
		backendUrlReviews.searchParams.append("orderBy", sortingOrder);
	}
	if (searchKeyword) {
		backendUrlReviews.searchParams.append("searchBy", searchKeyword);
	}
	
	$.ajax({
	  url: backendUrlReviews,
	  type: "GET",
	  success: function(response) {
		
		loadReviewsTab(response, loadMore);

	  },
	  error: function(error) {
		console.log(error);
	  }
	});
}

function loadMore() {
	getReviews(true);
}

	loadGeneralReviewCard(response);

function loadGeneralReviewCard(response) {

		} else {
			avgRating = avgRating.toFixed(1);
		}

			countRevText = "";
		} else if (countRev === 1) {
			countRevText = "(1 evaluare)";
		} else {
			countRevText = "(" + countRev + " evaluări)";
		}
		
		var wouldRecommend = response.result.percentageWouldRecommend ? response.result.percentageWouldRecommend.toFixed(0) : "N/A";

+'															<span class="ranking-t1">/</span>'
+'															<span class="ranking-t2">5</span>';

			avgDifficultyText = '							<span class="ranking-t1">'+ avgDifficulty + '</span>';
		}

		var countRev1Star = response.result.countRev1Star ? response.result.countRev1Star : 0;

		var countRev4StarsPercentage = totalCountRevStars !== 0 ? ((countRev4Stars * 100) / totalCountRevStars).toFixed(0): 0;

				var backendUrlTopReviews = new URL(backendUrlRoot + "/v1/review/faculty/" + facultyId);

function reportReview(el) {

	var regularIcon = "far";
	var solidIcon = "fas";
	
	if ($(el).hasClass(regularIcon)) {

		var reviewId = $(el).parent().parent().parent().attr("data-reviewid");
		
		var backendUrl = new URL(backendUrlRoot + "/v1/review/" + reviewId + "/report");
		
		$.ajax({
			url: backendUrl,
			type: 'PUT',
			dataType: 'json',
			contentType: 'application/json',
			crossDomain: true,
			success: function () {
				document.getElementById('generic-modal-text').innerHTML = "Evaluarea a fost raportata";
				$(el).removeClass(regularIcon);
				$(el).addClass(solidIcon);
			},
			error: function(error) {
				console.log(error);
				document.getElementById('generic-header-text').innerHTML = '<i class="fas fa-exclamation-triangle fa-3x"></i>';
				if (error.responseJSON) {
					if (error.responseJSON.control) {
						var errorDescription = error.responseJSON.control.errorDescription;
						document.getElementById('generic-modal-text').innerHTML = errorDescription;
					}
					document.getElementById('generic-modal-text').innerHTML = "Evaluarea nu a putut fi raportata";
				}
			}
		});
	
	}
}

function upvoteReview(el) {

	var regularIcon = "far";
	var solidIcon = "fas";
	
	var upvote;
	if ($(el).hasClass(regularIcon)) {
		upvote = true;
	} else {
		upvote = false; // take back the vote
	}
	
		var upvotesValue = parseInt(el.nextSibling.innerHTML);

		var reviewId = $(el).parent().parent().parent().attr("data-reviewid");
		
		var backendUrl = new URL(backendUrlRoot + "/v1/review/" + reviewId + "/upvote");
		
		var body = {
			upvote: upvote
		};
		
		$.ajax({
			url: backendUrl,
			type: 'PUT',
			dataType: 'json',
			contentType: 'application/json',
			crossDomain: true,
			data: JSON.stringify(body),
			success: function (data) {
				if ($(el).hasClass(regularIcon)) {
					$(el).removeClass(regularIcon);
					$(el).addClass(solidIcon);
					el.nextSibling.innerHTML = (upvotesValue + 1);
				} else {
					$(el).removeClass(solidIcon);
					$(el).addClass(regularIcon);
					el.nextSibling.innerHTML = (upvotesValue - 1);
				}
			},
			error: function(error) {
				console.log(error);
				if (error.responseJSON) {
					if (error.responseJSON.control) {
						var errorDescription = error.responseJSON.control.errorDescription;
						alert(errorDescription);
					}
					alert("Evaluarea nu a putut fi votata");
				}
			}
		});

}
