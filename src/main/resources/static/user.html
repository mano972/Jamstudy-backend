window.addEventListener('beforeunload', function(e) {

    //want to leave. The text of this dialog is controlled by the browser.

function getUserProfileInfo() {
	var backendUrl = new URL(backendUrlRoot + "/v1/userprofile");
	
	$.ajax({
	  url: backendUrl,
	  type: "GET",
	  success: function(response) {
		if (response.control.errorCode === 0) {
		
			var userResponse = response.result;
			loadUserProfileInfoContent(userResponse);
			checkProfileComplete();

		} else {
			console.log(response.control.errorDescription);
		}

	  },
	  error: function(error) {
		checkLoggedInUser(error.status)
	  },
	  complete: function (data) {
		<!-- document.getElementById("loading").style.display = "none"; -->
	  }
	});
	
}

function saveUserProfileInfo(el) {

	var firstName = document.getElementById("profile-first-name").value ? document.getElementById("profile-first-name").value : "";
	var lastName = document.getElementById("profile-name").value ? document.getElementById("profile-name").value : "";
	var loc = document.getElementById("profile-city").value ? document.getElementById("profile-city").value : "";
	var birthDate = document.getElementById("profile-birth-date").value ? document.getElementById("profile-birth-date").value : null;
	
	var userStatusRadio = document.getElementsByName('status');
	var userStatus;
	for (var i = 0, length = userStatusRadio.length; i < length; i++) {
	  if (userStatusRadio[i].checked) {
		userStatus = userStatusRadio[i].value;
		break;
	  }
	}
	var yearsRadio = document.getElementsByName('years');
	var userYear;
	for (var i = 0, length = yearsRadio.length; i < length; i++) {
	  if (yearsRadio[i].checked) {
		userYear = yearsRadio[i].value;
		break;
	  }
	}
	
	var userWorkingRadio = document.getElementsByName('work');
	var userWorking;
	for (var i = 0, length = userWorkingRadio.length; i < length; i++) {
	  if (userWorkingRadio[i].checked && userWorkingRadio[i].value != 2) {
		userWorking = userWorkingRadio[i].value;
		break;
	  }
	}
	
	var userDomainInterest = []
	var checkboxesDomains = document.querySelectorAll('input[name=domeniu]:checked');
	for (var i = 0; i < checkboxesDomains.length; i++) {
		userDomainInterest.push(checkboxesDomains[i].value)
	}
	var userCityInterest = []
	var checkboxesCities = document.querySelectorAll('input[name=oras]:checked');
	for (var i = 0; i < checkboxesCities.length; i++) {
		userCityInterest.push(checkboxesCities[i].value.replace(";", ","))
	}
	
	var subscribeToNewsletter = false;
	var newsletterCheckBoxElementId = $("label[for=newsletter-check]").attr("for");
	var newsletterCheckBoxElement = $("input[id='" + newsletterCheckBoxElementId + "']");
	if (newsletterCheckBoxElement.prop("checked") === true) {
		subscribeToNewsletter = true;;
	}
	
	var body = {
		firstName: firstName,
		lastName: lastName,
		location: loc,
		birthDate: birthDate,
		userStatus: userStatus,
		userYear: userYear,
		isUserWorking: userWorking,
		userDomainInterest : userDomainInterest,
		userCityInterest: userCityInterest,
		subscribeToNewsletter: subscribeToNewsletter
	}
	
	var backendUrl = new URL(backendUrlRoot + "/v1/userprofile");
	
	$.ajax({
		url: backendUrl,
		type: 'PUT',
		dataType: 'json',
		contentType: 'application/json',
		crossDomain: true,
		data: JSON.stringify(body),
		success: function (data) {
			document.getElementById('save-profile-area').style.display = "none";
			location.reload();
		},
		error: function(error) {
			checkLoggedInUser(error.status);
			$("#general-modal").modal();
			document.getElementById('modal-header-text').innerHTML = '<i class="fas fa-exclamation-triangle fa-3x"></i>';
			document.getElementById('modal-text').innerHTML = "Eroare. Profilul nu a putut fi salvat";
		}
	});
	
}

function getRecentlyViewedFaculties() {

	if (typeof(Storage) == "undefined") {
		return;
	}

	var facultyIdsString = localStorage.getItem("rvi");
	var facultyIds;
	if (facultyIdsString) {
		facultyIds = facultyIdsString.split(",");
	}
	if (!facultyIds || facultyIds.length === 0) {
		document.getElementById("recently-viewed-faculties").innerHTML = '';
		document.getElementById("recent-faculties-section").style.padding = '0px';
		return;
	}

	var limit = 16;
	var backendUrl = new URL(backendUrlRoot + "/v1/faculty");
	backendUrl.searchParams.append("facultyIds", facultyIds.join());
	backendUrl.searchParams.append("limit", limit);
	
	  $.ajax({
	  url: backendUrl,
	  type: "GET",
	  beforeSend : function(request) {
			document.getElementById("recently-viewed-faculties").innerHTML = '	<div class="text-center" style="height: 350px;">'
																					+'<div class="uil-reload-css reload-background" style=""><div></div></div>'
																				+'</div>';
			
		  },
	  success: function(response) {
		if (response.control.errorCode === 0) {
			var facultyIdsCopy = facultyIds.slice();
			var sortedResponse = response.result.faculties.map(function(item) {
				var n = facultyIdsCopy.indexOf(item.facultyId);
				facultyIdsCopy[n] = '';
				return [n, item]
			}).sort(function (a, b) { return a[0] - b[0];  }).map(function(j) { return j[1] });
			sortedResponse = sortedResponse.reverse();
			loadRecentlyViewedFacultiesContent(sortedResponse);
		} else {
			console.log(response.control.errorDescription);
		}

	  },
	  error: function(error) {
		checkLoggedInUser(error.status);
	  }
	});
}

function loadRecentlyViewedFacultiesContent(sortedResponse) {

	var faculties = sortedResponse;
	
	if (faculties.length == 0 ) {
		document.getElementById("recently-viewed-faculties").innerHTML = '';
		document.getElementById("recent-faculties-section").style.padding = '0px';
		return;
	}
	
	
	var recentFacultiesString = 
'						<div class="row">'
+'							<div class="col-xs-12">'
+'								<h4 class="title">Recent vizualizate</h4>         '           
+'							</div>'
+'						</div>';

	var windowWidth = $(window).width();
	var colWidth;
	var recentFacultiesPerSlide;
	if (windowWidth > 1200) {
		colWidth = 'col-md-3';
		recentFacultiesPerSlide = 4;
	} else if (windowWidth > 992) {
		colWidth = 'col-md-4';
		recentFacultiesPerSlide = 3;
	} else if (windowWidth > 768) {
		colWidth = 'col-sm-6';
		recentFacultiesPerSlide = 2;
	} else {
		colWidth = 'col-xs-12';
		recentFacultiesPerSlide = 1;
	}
	
	recentFacultiesString += 
'						<div class="row">'
+'							<div class="col-md-12">'
+'							  <div class="carousel slide media-carousel" id="media">'
+'								<div id="recent-faculties-carousel" class="carousel-inner">';
	
	var i;
	for (i in faculties) {
	
			if (i == 0) {
				recentFacultiesString += (
		'						<div class="item active">'
		+'							<div class="row">');
			}
			if (i!=0 && (i%recentFacultiesPerSlide)==0) {
				recentFacultiesString += (
		'						<div class="item">'
		+'							<div class="row">');
			}
			var faculty = faculties[i];
			var universityNameFront;
			var universityName = faculty.universityName;
			if (universityName.length > 50) {
				universityNameFront = universityName.substring(0, 50).concat('...');
			} else {
				universityNameFront = universityName;
			}
			var universityNameTooltipTitle = universityName.replaceAll("\"", "");
			
			var avgRating = faculties[i].avgRating;
			if (!avgRating) {
				avgRating = "N/A";
			} else {
				avgRating = avgRating.toFixed(1);
			}
			
			var logoSrc = backendUrlRoot + "/v1/faculty/" + faculties[i].facultyId + "/logo";	
			
			var urlProfileRedirect = "./profile.html?id=";
			
			recentFacultiesString += (
						'<div class="' + colWidth + '"><div class="card inner-card"> <div class="content"> <div class="row"> <div class="col-xs-6 col-xs-offset-3"> <a href="' + urlProfileRedirect + faculty.facultyId + '"> <div class="img-faculty-logo-block-base img-faculty-logo-carousel-block"> <img id="logo" src="' + logoSrc + '" class="img-faculty-logo-base img-faculty-logo-carousel center"></img> </div> </a> </div> <div class="col-xs-12" style="margin-top: 15px; height: 170px;"> <a href="' + urlProfileRedirect + faculty.facultyId + '"> <h5><strong>' + faculty.facultyName + '</strong></h5> </a> <small data-toggle="tooltip" title="' + universityNameTooltipTitle + '">' + universityNameFront + '</small> <br> <small class="text-muted">' + faculty.facultyCity + '</small> <br> <a  data-toggle="tooltip" title="Vezi evaluări" onclick="goToReviews(&quot;'+faculty.facultyId+'&quot;)"> <i class="fa fa-star rating-suggestion-card" style="color: orange"></i> <strong style="color: orange">' + avgRating + '</strong> </a> </div>  </div> </div> </div> </div>');

		if (i==(faculties.length - 1) || i%recentFacultiesPerSlide==(recentFacultiesPerSlide-1)) {
			recentFacultiesString += ('</div> </div>');
		}
		
	}
	
	recentFacultiesString += 
'								</div>'
+'								<a data-slide="prev" href="#media" class="left carousel-control">‹</a>'
+'								<a data-slide="next" href="#media" class="right carousel-control">›</a>'
+'							  </div>    '                      
+'							</div>'
+'						</div>';
	
	document.getElementById("recently-viewed-faculties").innerHTML = recentFacultiesString;
	
	$('#media').carousel('pause');
	
}

function deleteReviewModal(el, reviewId) {
	el.setAttribute("data-toggle", 'modal');
	el.setAttribute("data-target", '#general-modal');
	
	document.getElementById('modal-header-text').innerHTML = '<i class="fas fa-exclamation fa-2x"></i>';
	document.getElementById('modal-text').innerHTML = "Esti sigur ca vrei sa stergi aceasta evaluare?";
	document.getElementById('general-modal-footer').innerHTML = 
					'<div class="left-side">'
					+'	<button type="button" class="btn btn-default btn-simple" data-dismiss="modal" style="color: red;" onclick="deleteReview(&quot;'+reviewId+'&quot;)">Da</button>'
					+'</div>'
					+'<div class="divider"></div>'
					+'<div class="right-side">'
					+'	<button type="button" class="btn btn-simple" data-dismiss="modal">Nu</button>'
					+'</div>';

}

function deleteReview(reviewId) {

	var backendUrl = new URL(backendUrlRoot + "/v1/review/" + reviewId);

	var body = {
		delete: true
	}
	
	$.ajax({
	url: backendUrl,
	type: 'PUT',
	dataType: 'json',
	contentType: 'application/json',
	crossDomain: true,
	data: JSON.stringify(body),
	success: function (data) {
		var addedReviews = getUField("uar");
		addedReviews = addedReviews.filter(function(value, index, arr){
			return reviewId != value.reviewId;
		});
		setUField("uar", addedReviews);
		location.reload();
	},
	error: function(error) {
		checkLoggedInUser(error.status);
	}
	});

}

function viewMore(i) {
  var moreText = document.getElementById("view-more-text-" + i);
  var btnText = document.getElementById("view-more-button-" + i);
  
  if (moreText.style.display === "none") {
		btnText.innerHTML = "- Vezi mai putin";
		moreText.style.display = "inline";
  } else {
		btnText.innerHTML = "+ Vezi tot";
		moreText.style.display = "none";
  }
}
