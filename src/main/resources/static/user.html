function getUserProfileInfo() {
	var backendUrl = new URL(backendUrlRoot + "/v1/userprofile");
	
	$.ajax({
	  url: backendUrl,
	  type: "GET",
	  success: function(response) {
		if (response.control.errorCode === 0) {
		
			var userResponse = response.result;
			loadUserProfileInfoContent(userResponse);
			checkProfileComplete();

		} else {
			console.log(response.control.errorDescription);
		}

	  },
	  error: function(error) {
		checkLoggedInUser(error.status)
	  },
	  complete: function (data) {
		<!-- document.getElementById("loading").style.display = "none"; -->
	  }
	});
	
}

function checkProfileComplete() {
	var firstName = document.getElementById("profile-first-name").value;
	var lastName = document.getElementById("profile-name").value;
	var location = document.getElementById("profile-city").value;
	var birthDate = document.getElementById("profile-birth-date").value;
	var userStatusRadio = document.getElementsByName('status');
	var userStatus;
	for (var i = 0, length = userStatusRadio.length; i < length; i++) {
	  if (userStatusRadio[i].checked) {
		userStatus = userStatusRadio[i].value;
		break;
	  }
	}
	
	var firstNameText = firstName ? (" " + firstName) : "";
	var userProfileTopString
	if (!firstName || !lastName || !location || !birthDate || !userStatus) {
	userProfileTopString = 
		'											<h3>'
		+'												Hei' + firstNameText + ', profilul tau este incomplet!'
		+'											</h3>'
		+'											<h5>'
		+'												Ca sa iti putem oferi o experienta personalizata, te rugam sa completezi profilul.'
		+'											</h5>';
	} else {
		userProfileTopString = 
		'											<h3>'
		+'												Hei' + firstNameText + ', profilul tau este complet!'
		+'											</h3>'
		+'											<h5>'
		+'												Ne bucuram sa iti putem oferi o experienta personalizata.'
		+'											</h5>';
	}
	
	document.getElementById("user-profile-top").innerHTML = userProfileTopString;
}

function saveUserProfileInfo(el) {

	var firstName = document.getElementById("profile-first-name").value ? document.getElementById("profile-first-name").value : "";
	var lastName = document.getElementById("profile-name").value ? document.getElementById("profile-name").value : "";
	var loc = document.getElementById("profile-city").value ? document.getElementById("profile-city").value : "";
	var birthDate = document.getElementById("profile-birth-date").value ? document.getElementById("profile-birth-date").value : null;
	
	var userStatusRadio = document.getElementsByName('status');
	var userStatus;
	for (var i = 0, length = userStatusRadio.length; i < length; i++) {
	  if (userStatusRadio[i].checked) {
		userStatus = userStatusRadio[i].value;
		break;
	  }
	}
	var yearsRadio = document.getElementsByName('years');
	var userYear;
	for (var i = 0, length = yearsRadio.length; i < length; i++) {
	  if (yearsRadio[i].checked) {
		userYear = yearsRadio[i].value;
		break;
	  }
	}
	
	var userWorkingRadio = document.getElementsByName('work');
	var userWorking;
	for (var i = 0, length = userWorkingRadio.length; i < length; i++) {
	  if (userWorkingRadio[i].checked && userWorkingRadio[i].value != 2) {
		userWorking = userWorkingRadio[i].value;
		break;
	  }
	}
	
	var subscribeToNewsletter = false;
	var newsletterCheckBoxElementId = $("label[for=newsletter-check]").attr("for");
	var newsletterCheckBoxElement = $("input[id='" + newsletterCheckBoxElementId + "']");
	if (newsletterCheckBoxElement.prop("checked") === true) {
		subscribeToNewsletter = true;;
	}
	
	var body = {
		firstName: firstName,
		lastName: lastName,
		location: loc,
		birthDate: birthDate,
		userStatus: userStatus,
		userYear: userYear,
		isUserWorking: userWorking,
		subscribeToNewsletter: subscribeToNewsletter
	}
	
	var backendUrl = new URL(backendUrlRoot + "/v1/userprofile");
	
	$.ajax({
		url: backendUrl,
		type: 'PUT',
		dataType: 'json',
		contentType: 'application/json',
		crossDomain: true,
		data: JSON.stringify(body),
		success: function (data) {
			document.getElementById('save-profile-area').style.display = "none";
			location.reload();
		},
		error: function(error) {
			checkLoggedInUser(error.status);
			el.setAttribute("data-toggle", 'modal');
			el.setAttribute("data-target", '#general-modal');
			document.getElementById('modal-header-text').innerHTML = '<i class="fas fa-exclamation-triangle fa-3x"></i>';
			document.getElementById('modal-text').innerHTML = "Eroare. Profilul nu a putut fi salvat";
		}
	});
	
}

function getSavedFaculties() {

	// or use the user profile call to get the faculty ids

	if (!savedFacultiesIds || savedFacultiesIds.length == 0) {

function deleteReviewModal(el, reviewId) {

function deleteReview(reviewId) {

	var backendUrl = new URL(backendUrlRoot + "/v1/review/" + reviewId);

	var body = {
		delete: true
	}
	
	$.ajax({
	url: backendUrl,
	type: 'PUT',
	dataType: 'json',
	contentType: 'application/json',
	crossDomain: true,
	data: JSON.stringify(body),
	success: function (data) {
		var addedReviews = getUField("uar");
		addedReviews = addedReviews.filter(function(value, index, arr){
			return reviewId != value.reviewId;
		});
		setUField("uar", addedReviews);
		location.reload();
	},
	error: function(error) {
		checkLoggedInUser(error.status);
	}
	});

}

function viewMore(i) {
  var moreText = document.getElementById("view-more-text-" + i);
  var btnText = document.getElementById("view-more-button-" + i);
  
  if (moreText.style.display === "none") {
		btnText.innerHTML = "- Vezi mai putin";
		moreText.style.display = "inline";
  } else {
		btnText.innerHTML = "+ Vezi tot";
		moreText.style.display = "none";
  }
}
