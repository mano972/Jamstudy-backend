<script type="text/javascript">

    const backendUrlRoot = "https://unistart.ro/Jamstudy";

    $().ready(function(){
<!--        checkEntityAdminLogin();-->
    });

    function checkEntityAdminLogin() {
        var jwtToken = getAField("ut");
        if (jwtToken) {
            var urlRedirect = "./admin-portal.html";
            window.location.replace(urlRedirect);
        }
    }

    function loginEntity() {
        var username = document.getElementById("login-username").value.trim();
        var userPass = document.getElementById("login-pass").value.trim();

        document.getElementById("login-button").disabled = true;

        var backendUrl = new URL(backendUrlRoot + "/v1/entityprofile/login");

        var body = {
            username: username,
            password: userPass
        };

        $.ajax({
            url: backendUrl,
            type: 'POST',
            dataType: 'json',
            contentType: 'application/json',
            crossDomain: true,
            data: JSON.stringify(body),
            success: function (response) {
                localStorage.setItem("a", "{}");
                var jwtToken = response.result.jwtToken;
                setAField("ut", jwtToken);

                var currentLocationPath = window.location.pathname;
                if (currentLocationPath.includes("admin-portal-login")) {
                    var urlRedirect = "./admin-portal.html";
                    window.location.replace(urlRedirect);
                } else {
                    location.reload();
                }
            },
            error: function(error) {
                console.log(error);
            }
        });

    }

</script>
