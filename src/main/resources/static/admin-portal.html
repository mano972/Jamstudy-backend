<script type="text/javascript">

const backendUrlRoot = "https://unistart.ro/Jamstudy";
var facultyId;

<!-- Rich text editor -->
let optionsButtons = document.querySelectorAll(".option-button");
let advancedOptionButton = document.querySelectorAll(".adv-option-button");
let fontName = document.getElementById("fontName");
let fontSizeRef = document.getElementById("fontSize");
let writingArea = document.getElementById("text-input-rich");
let linkButton = document.getElementById("createLink");
let alignButtons = document.querySelectorAll(".align");
let spacingButtons = document.querySelectorAll(".spacing");
let formatButtons = document.querySelectorAll(".format");
let scriptButtons = document.querySelectorAll(".script");
//List of fontlist
let fontList = [
  "Arial",
  "Verdana",
  "Times New Roman",
  "Garamond",
  "Georgia",
  "Courier New",
  "cursive",
];
//Initial Settings
const initializer = () => {
  //function calls for highlighting buttons
  //No highlights for link, unlink,lists, undo,redo since they are one time operations
  highlighter(alignButtons, true);
  highlighter(spacingButtons, true);
  highlighter(formatButtons, false);
  highlighter(scriptButtons, true);
  //create options for font names
  fontList.map((value) => {
    let option = document.createElement("option");
    option.value = value;
    option.innerHTML = value;
    fontName.appendChild(option);
  });
  //fontSize allows only till 7
  for (let i = 1; i <= 7; i++) {
    let option = document.createElement("option");
    option.value = i;
    option.innerHTML = i;
    fontSizeRef.appendChild(option);
  }
  //default size
  fontSizeRef.value = 3;
};
//main logic
const modifyText = (command, defaultUi, value) => {
  //execCommand executes command on selected text
  document.execCommand(command, defaultUi, value);
};
//For basic operations which don't need value parameter
optionsButtons.forEach((button) => {
  button.addEventListener("click", () => {
    modifyText(button.id, false, null);
  });
});
//options that require value parameter (e.g colors, fonts)
advancedOptionButton.forEach((button) => {
  button.addEventListener("change", () => {
    modifyText(button.id, false, button.value);
  });
});
//link
linkButton.addEventListener("click", () => {
  let userLink = prompt("Enter a URL");
  //if link has http then pass directly else add https
  if (/http/i.test(userLink)) {
    modifyText(linkButton.id, false, userLink);
  } else {
    userLink = "http://" + userLink;
    modifyText(linkButton.id, false, userLink);
  }
});
//Highlight clicked button
const highlighter = (className, needsRemoval) => {
  className.forEach((button) => {
    button.addEventListener("click", () => {
      //needsRemoval = true means only one button should be highlight and other would be normal
      if (needsRemoval) {
        let alreadyActive = false;
        //If currently clicked button is already active
        if (button.classList.contains("active-rich")) {
          alreadyActive = true;
        }
        //Remove highlight from other buttons
        highlighterRemover(className);
        if (!alreadyActive) {
          //highlight clicked button
          button.classList.add("active-rich");
        }
      } else {
        //if other buttons can be highlighted
        button.classList.toggle("active-rich");
      }
    });
  });
};
const highlighterRemover = (className) => {
  className.forEach((button) => {
    button.classList.remove("active-rich");
  });
};
window.onload = initializer();

<!-- Cover image -->
var inputImage = document.getElementById("cover-image-upload");
inputImage.addEventListener("change", () => {
    const files = inputImage.files;
    var imageOutput = document.getElementById('display-image');
    imageOutput.src = URL.createObjectURL(files[0]);

    const formData = new FormData();
    formData.append('image', files[0]);

    const backendUrl = backendUrlRoot + "/v1/faculty/" + facultyId + "/cover";
    fetch(backendUrl, {
        method: 'POST',
        body: formData,
    })
    .then(response => response.json())
    .catch(error => console.error(error))
    });

$().ready(function(){
    redirectEntityAdminIfNotLoggedIn();

    getFaculty();
    getReviews(false);
});

function redirectEntityAdminIfNotLoggedIn() {
    var jwtToken = getAField("ut");
    if (!jwtToken) {
        var urlLoginRedirect = "./admin-portal-login.html";
        window.location.replace(urlLoginRedirect);
    }
}

function getFaculty() {
    var backendUrl = new URL(backendUrlRoot + "/v1/entityprofile/faculty/");

      $.ajax({
      url: backendUrl,
      type: "GET",
      headers: {Token: getAField("ut") ? "Bearer " + getAField("ut") : null},
      success: function(response) {

        if (response.control.errorCode === 0) {
            facultyId = response.result.facultyId;
            var facultyName = escapeHtml(response.result.facultyName);
			var universityName = escapeHtml(response.result.universityName);
			var facultyCity = escapeHtml(response.result.facultyCity);
			var avgRating = response.result.avgRating;
			if (!avgRating) {
				avgRating = "N/A";
			} else {
				avgRating = avgRating.toFixed(1);
			}
			var countRev = response.result.countRev;
			var countRevText;
			if (!countRev) {
				countRevText = "";
			} else if (countRev === 1) {
				countRevText = "(1 <span>review</span>)";
			} else {
				countRevText = "(" + countRev + " <span>reviews</span>)";
			}

            var facultyPresentationText = response.result.facultyPresentation;
            if (facultyPresentationText && facultyPresentationText != "") {
                let writingArea = document.getElementById("text-input-rich");
                writingArea.innerHTML = facultyPresentationText;
            }

            facultyProfileHeaderString = (
                        				'<div>'
                        +						'<h4 class="faculty-title-profile">' + facultyName + '</h4>'
                        +						'<strong>' + universityName + '</strong>'
                        +						'<br>'
                        +						'<small class="text-muted">' + facultyCity + '</small>'
                        +						'<br>'
                        +						'<div>'
                        +							'<i class="fa fa-star fa-lg align-orange"></i>'
                        +							'<h3 class="align-orange">&nbsp' + avgRating + '</h3>'
                        +							'<h5 class="align"><strong>&nbsp' + countRevText + '</strong></h5>'
                        +						'</div>'
                        +				'</div>'
            );
			document.getElementById("faculty-details").innerHTML += facultyProfileHeaderString;
			loadCoverImage();


        } else {
            console.log(response.control.errorDescription);
        }

      },
      error: function(error) {
        console.log(error);
      }
    });
}

function loadCoverImage() {
    var imageOutput = document.getElementById('display-image');

    var backendUrl = new URL(backendUrlRoot + "/v1/faculty/" + facultyId + "/cover");

    imageOutput.src = backendUrl;

}

function getReviews(loadMore) {

    var numberOfResultsPerPage = 10;
    var sortingOrder = document.getElementById("reviews-sorting").value;
    var searchKeyword = document.getElementById("search-review-keyword").value;

    var offset;
    if (loadMore) {
        offset = currentlyVisibleReviewsNo;
    } else {
        offset = 0;
    }

    var backendUrlReviews = new URL(backendUrlRoot + "/v1/entityprofile/reviews");

    if (offset) {
        backendUrlReviews.searchParams.append("offset", offset);
    }
    if (numberOfResultsPerPage) {
        backendUrlReviews.searchParams.append("limit", numberOfResultsPerPage);
    }
    if (sortingOrder) {
        backendUrlReviews.searchParams.append("orderBy", sortingOrder);
    }
    if (searchKeyword) {
        backendUrlReviews.searchParams.append("searchBy", searchKeyword);
    }

    $.ajax({
      url: backendUrlReviews,
      type: "GET",
      headers: {Token: getAField("ut") ? "Bearer " + getAField("ut") : null},
       beforeSend : function(request) {
        if (!loadMore) {
            document.getElementById("faculty-profile-review-entries").innerHTML = '	<div class="text-center">'
                                                                                    +'<div class="uil-reload-css reload-background" style=""><div></div></div>'
                                                                                +'</div>';
            document.getElementById("load-more-reviews-main").innerHTML = '';
        } else {
            document.getElementById("load-more-reviews-main").innerHTML = '<div class="text-center"><div class="uil-reload-css reload-background" style=""><div></div></div></div>';
        }
      },
      success: function(response) {

        loadReviewsTab(response, loadMore);

      },
      error: function(error) {
        checkLoggedInUser(error.status)
      }
    });
}

function loadMore() {
    getReviews(true);
}

function loadReviewsTab(response, loadMore) {

    if (loadMore) {
        currentlyVisibleReviewsNo += response.result.reviews.length;
    } else {
        document.getElementById("faculty-profile-review-entries").innerHTML = '';
        currentlyVisibleReviewsNo = response.result.reviews.length;
    }

    if  (currentlyVisibleReviewsNo >= response.result.count) {
        document.getElementById("load-more-reviews-main").innerHTML = '';
    } else {
        document.getElementById("load-more-reviews-main").innerHTML = '<div class="card">'
                                                                    + '<div class="content"> '
                                                                        + '<div class="text-center row"> '
                                                                            + '<button id="load-more-reviews" class="btn btn-info btn-fill" type="submit" onclick="loadMore()">Load more reviews</button>'
                                                                        + '</div> '
                                                                    + '</div> '
                                                                + '</div>';
    }

    if (response.result.reviews.length == 0) {
        document.getElementById("faculty-profile-review-entries").innerHTML = '<div class="text-center text-muted"> <h4>There are no reviews yet</h4> </div>';
    }

    var i;
    for (i in response.result.reviews) {

        var reviewId = response.result.reviews[i].reviewId;
        var facultyName = escapeHtml(response.result.reviews[i].facultyName);
        var userName = escapeHtml(response.result.reviews[i].userName ? response.result.reviews[i].userName : "");
        var formattedReviewDate = response.result.reviews[i].formattedReviewDate ? response.result.reviews[i].formattedReviewDate : "N/A";
        var userStatus = response.result.reviews[i].userStatus ? response.result.reviews[i].userStatus.toLowerCase() : "";
        if (userStatus === 'drop-out') {
            userStatus = "";
        }
        var userDomainOfLicenseOrMaster = response.result.reviews[i].userDomainOfLicenseOrMaster ? response.result.reviews[i].userDomainOfLicenseOrMaster : "";
        var userProgramName = response.result.reviews[i].userProgramName ? response.result.reviews[i].userProgramName : "";
        var userYear = response.result.reviews[i].userYear ? response.result.reviews[i].userYear : "";
        var userDetailsString = escapeHtml(userStatus + (userYear ? " - " + userYear : "") + (userDomainOfLicenseOrMaster ? " - " + userDomainOfLicenseOrMaster : "") + (userProgramName ? " - " + userProgramName : ""));
        var upvotes = response.result.reviews[i].upvotes ? response.result.reviews[i].upvotes : 0;
        var wouldRecommend = response.result.reviews[i].wouldRecommend;
        var wouldRecommendText;
        var wouldRecommendBoxClass;
        var wouldRecommendTextClass;
        var wouldRecommendTranslation;
        if (wouldRecommend === true) {
            wouldRecommendText = "Would recommend";
            wouldRecommendBoxClass = "box green";
            wouldRecommendTextClass = "would-recommend-text";
            wouldRecommendTranslation = "would-recommend";
        } else if (wouldRecommend === false) {
            wouldRecommendText = "Would not recommend";
            wouldRecommendBoxClass = "box red";
            wouldRecommendTextClass = "would-not-recommend-text";
            wouldRecommendTranslation = "would-not-recommend";
        } else {
            wouldRecommendText = "";
            wouldRecommendBoxClass = "";
            wouldRecommendTextClass = "";
            wouldRecommendTranslation = "";
        }

        var difficulty = response.result.reviews[i].difficulty;
        var difficultyText;
        if (difficulty) {
            difficultyText = ':&nbsp' + difficulty + '/5';
        } else {
            difficultyText = ": N/A";
        }
        var wouldRecommendAndDifficultyRowString;
        if (wouldRecommendText || difficulty) {
            wouldRecommendAndDifficultyRowString =
                                                            '<br>'
            +'													<div class="row">'
            +'														<div  class="col-xs-6">'
            +'															<div class="'+ wouldRecommendBoxClass + '">'
            +'															</div>'
            +'															<span class=' + wouldRecommendTextClass + ' data-i18n-key=' + wouldRecommendTranslation + '>&nbsp&nbsp' + wouldRecommendText + '</span>'
            +'														</div>'
            +'													<div  class="col-xs-6">'
            +'															<span style="color: #707070;">&nbsp&nbsp Difficulty</span><span style="color: #707070;">' + difficultyText + '</span>'
            +'														</div>'
            +'													</div>';
        } else {
            wouldRecommendAndDifficultyRowString = "";
        }

        var upvotedReviewsIds = getUField("ulr");
        var upvotedRevClass;
        var upvotedRevText;
        if (upvotedReviewsIds && upvotedReviewsIds.includes(reviewId)) {

function replyButton(i) {

                            +        '<button id="submit-button" class="btn btn-success btn-block btn-fill" onclick="submitButton(' + i + ')">Submit</button>'
                            +'</div>'

    );
}

function submitButton(i) {
    var reviewAnswerText = document.getElementById("reply-text-" + i).value ? document.getElementById("reply-text-" + i).value : null;
    var reviewId = document.getElementById("reply-area-" + i).getAttribute("data-reviewid");


    var backendUrl = new URL(backendUrlRoot + "/v1/review/" + reviewId + "/reply");

    var data = {
        "reviewAnswerText": reviewAnswerText
    };

      $.ajax({
      url: backendUrl,
      type: "PUT",
      dataType: 'json',
      contentType: 'application/json',
      crossDomain: true,
      data: JSON.stringify(data),
      headers: {Token: getAField("ut") ? "Bearer " + getAField("ut") : null},
      success: function(response) {

        window.location.reload();

      },
      error: function(error) {
        console.log(error);
      }
    });

}

function editButton(i) {
    document.getElementById("edit-button-" + i).style.display = "none";
<!--    document.getElementById("delete-button-" + i).style.display = "none";-->

                        +       '<div class="form-group col-xs-11">'

function submitText(e) {
    e.preventDefault;
    let writingArea = document.getElementById("text-input-rich");
    let presentationText = writingArea.innerHTML;

    var backendUrl = new URL(backendUrlRoot + "/v1/faculty/" + facultyId + "/presentation");

    var data = {
        "facultyPresentation": presentationText
    };

    $.ajax({
      url: backendUrl,
      type: "PUT",
      dataType: 'json',
      contentType: 'application/json',
      crossDomain: true,
      data: JSON.stringify(data),
      headers: {Token: getAField("ut") ? "Bearer " + getAField("ut") : null},
      success: function(response) {

        window.location.reload();

      },
      error: function(error) {
        console.log(error);
      }
    });

}

function viewMore(i) {
  var moreText = document.getElementById("view-more-text-" + i);
  var btnText = document.getElementById("view-more-button-" + i);

  if (moreText.style.display === "none") {
		btnText.innerHTML = "- See less";
		moreText.style.display = "inline";
		btnText.setAttribute("data-i18n-key", "see-less");
  } else {
		btnText.innerHTML = "+ See more";
		moreText.style.display = "none";
		btnText.setAttribute("data-i18n-key", "see-all");
  }

}

function addHash(obj) {
	var hash = obj.href.split("#")[1];
	history.replaceState(null, null, "#" + hash);
}
