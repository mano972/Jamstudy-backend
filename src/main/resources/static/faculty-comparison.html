function removeFromCompare(facultyId) {

	if (typeof(Storage) !== "undefined") {
		var facultyIdsString = localStorage.getItem("faculty-comparison-items");
		var facultyIds;
		if (facultyIdsString) {
			facultyIds = facultyIdsString.split(",");
		} else {
			facultyIds = [];
		}
		console.log(facultyIds);
		if (facultyIds.includes(facultyId)) {
			facultyIds = facultyIds.filter(function(value, index, arr){ return value !== facultyId;});
		}
		console.log(facultyIds);
		localStorage.setItem("faculty-comparison-items", facultyIds);
		
		getFaculties();
		
	} else {
	  // Sorry! No Web Storage support..
	}
}


function getFaculties() {

	var backendUrl = new URL(backendUrlRoot + "/v1/faculty/details");

	if (typeof(Storage) == "undefined") {
		return;
	}

	var facultyIdsString = localStorage.getItem("faculty-comparison-items");
	var facultyIds;
	if (facultyIdsString) {
		facultyIds = facultyIdsString.split(",");
	}
	console.log(facultyIds);
	if (!facultyIds || facultyIds.length === 0) {
		document.getElementById("comparison-table").innerHTML = '<div class="text-center text-muted center"> <h4>Adaugă o facultate pentru a începe</h4><a href="./search-results.html"utton class="btn btn-info btn-block btn-fill">Caută Facultăți</a> </div>';
		document.getElementById("comparison-table").style.height = "500px";
		document.getElementById("comparison-table").style.width = "1200px";
		document.getElementById("comparison-table").style.border = "none";
		document.getElementById("loading").style.display = "none";
		return;
	}
	backendUrl.searchParams.append("facultyIds", facultyIds.join());
	
	

	  $.ajax({
	  url: backendUrl,
	  type: "GET",
	  success: function(response) {
		console.log(response);
		
		if (response.control.errorCode === 0) {
			loadComparisonTableContent(response);
		} else {
			console.log(response.control.errorDescription);
		}

	  },
	  error: function(error) {
		console.log(error);
	  },
	  complete: function (data) {
		document.getElementById("loading").style.display = "none";
	  }
	});
}

function loadComparisonTableContent(response) {

	var collColumnWidth = "col-xs-3";
	
	const cellWidth = 300;
	var noOfFaculties = response.result.faculties.length;
	var noOfFacultiesIncludingHeader = noOfFaculties + 1;
	var comparisonRowWidth = cellWidth * noOfFacultiesIncludingHeader;
	var comparisonTableWidth = (cellWidth * noOfFacultiesIncludingHeader) + 2; // in order to not show the scroll bar all the time
	
	var comparisonTableElement = document.getElementById('comparison-table');
	comparisonTableElement.style.maxWidth = comparisonTableWidth + "px";
	
	var comparisonEvenRowElements = document.getElementsByClassName('comparison-even-row');
	var comparisonOddRowElements = document.getElementsByClassName('comparison-odd-row');
	var comparisonEvenRowElementsLength = comparisonEvenRowElements.length;
	var comparisonOddRowElementsLength = comparisonOddRowElements.length;
	
	do {
		comparisonEvenRowElementsLength--;
		comparisonEvenRowElements[comparisonEvenRowElementsLength].style.width = comparisonRowWidth + "px";
	} while (comparisonEvenRowElementsLength >= 1);
	
	do {
		comparisonOddRowElementsLength--;
		comparisonOddRowElements[comparisonOddRowElementsLength].style.width = comparisonRowWidth + "px";
	} while (comparisonOddRowElementsLength >= 1);

	}

	' 									<div class="comparison-cell ' + collColumnWidth + '"> '

	+' 											<i class="fa fa-star" style="color: orange; display: inline; vertical-align: middle;"></i> '
